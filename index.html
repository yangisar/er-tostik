<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: Descent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510; /* Deep Indigo base */
            font-family: 'Cinzel', serif;
            color: #d4af37; /* Muted Gold */
            touch-action: none; /* Prevents scrolling on mobile */
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .soul-meter {
            text-align: right;
        }

        .energy-bar-container {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 5px;
            border: 1px solid #d4af37;
        }

        .energy-fill {
            height: 100%;
            background: #d4af37;
            width: 100%;
            transition: width 0.1s;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        p {
            font-size: 1rem;
            color: #a0a0b0;
            max-width: 80%;
            line-height: 1.4;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:active {
            background: #d4af37;
            color: #050510;
        }

        .hidden {
            display: none !important;
        }

        .weight-indicator {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        #depth-display {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .layer-toast {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 20px #fff;
            opacity: 0;
            transition: opacity 1s;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="depth-display">0m</div>
            <div class="soul-meter">
                <div class="weight-indicator">SOUL WEIGHT</div>
                <div id="speed-display">NORMAL</div>
                <div class="energy-bar-container">
                    <div id="dash-bar" class="energy-fill"></div>
                </div>
            </div>
        </div>
        <div id="layer-msg" class="layer-toast">EARTH LAYER</div>
    </div>

    <div id="start-screen">
        <h1>ER TOSTIK:<br>DESCENT</h1>
        <p>Drag to Move. Tap to Dash.</p>
        <p>Avoid the shadows.<br>Collect Light to slow your fall.<br>Darkness makes you heavy.</p>
        <button class="btn" onclick="startGame()">Descend</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="color: #8a0e0e;">LOST</h1>
        <p id="final-depth">Depth: 0m</p>
        <p>The underworld claims another soul.</p>
        <button class="btn" onclick="resetGame()">Rise Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game State
        let gameActive = false;
        let score = 0; // Depth
        let speed = 5; // Vertical speed
        let baseSpeed = 5;
        let lastTime = 0;
        let layer = 0; // 0: Earth, 1: Forgotten, 2: Spirit
        
        // Player
        const player = {
            x: 0,
            y: 0,
            radius: 10,
            color: '#fff',
            energy: 100,
            dashing: false,
            trail: []
        };

        // Entities
        let obstacles = [];
        let particles = [];
        let collectibles = [];

        // Input
        let touchX = 0;
        let targetX = 0;

        // Resize handling
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.2; // Player stays at top 20%
            targetX = canvas.width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Listeners
        document.addEventListener('touchstart', (e) => {
            if(!gameActive) return;
            touchX = e.touches[0].clientX;
            targetX = touchX;
            checkDash();
        });
        
        document.addEventListener('touchmove', (e) => {
            if(!gameActive) return;
            e.preventDefault();
            touchX = e.touches[0].clientX;
            targetX = touchX;
        });

        // Mouse fallbacks for testing
        document.addEventListener('mousedown', () => { if(gameActive) checkDash(); });
        document.addEventListener('mousemove', (e) => {
            if(!gameActive) return;
            targetX = e.clientX;
        });

        function checkDash() {
            if (player.energy >= 30 && !player.dashing) {
                player.dashing = true;
                player.energy -= 30;
                // Dash visual effect
                for(let i=0; i<10; i++) {
                    particles.push(createParticle(player.x, player.y, 'white', 5));
                }
                setTimeout(() => { player.dashing = false; }, 400); // 0.4s invincibility
            }
        }

        // --- Generators ---

        function createObstacle(y) {
            const type = Math.random();
            let obs = {
                x: Math.random() * canvas.width,
                y: y,
                w: 0,
                h: 0,
                type: 'rock', // rock, root, mask, spirit
                speedMod: 1
            };

            // Layer Logic
            if (score < 1000) { // Earth Layer
                obs.type = Math.random() > 0.5 ? 'rock' : 'root';
                obs.w = 40 + Math.random() * 40;
                obs.h = 40 + Math.random() * 20;
            } else if (score < 2500) { // Forgotten Layer
                obs.type = Math.random() > 0.5 ? 'mask' : 'banner';
                obs.w = 30 + Math.random() * 30;
                obs.h = 50 + Math.random() * 30;
            } else { // Spirit Layer
                obs.type = 'shadow';
                obs.w = 50 + Math.random() * 50;
                obs.h = 50 + Math.random() * 50;
                obs.speedMod = 1.2; // Shadows move faster
            }
            return obs;
        }

        function createCollectible(y) {
            return {
                x: Math.random() * (canvas.width - 40) + 20,
                y: y,
                radius: 8,
                type: Math.random() > 0.7 ? 'dark' : 'light' // 30% dark, 70% light
            };
        }

        function createParticle(x, y, color, speedY) {
            return {
                x: x,
                y: y,
                size: Math.random() * 3,
                speedY: speedY || (Math.random() * 2 + 1),
                speedX: (Math.random() - 0.5) * 1,
                color: color,
                life: 1.0
            };
        }

        // --- Game Logic ---

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            gameActive = true;
            score = 0;
            speed = baseSpeed;
            player.energy = 100;
            obstacles = [];
            collectibles = [];
            particles = [];
            
            // Initial spawn
            for(let i=0; i<5; i++) {
                obstacles.push(createObstacle(canvas.height + (i * 300)));
            }
            
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            startGame();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('final-depth').innerText = `Depth Reached: ${Math.floor(score)}m`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function update(dt) {
            // Smooth player movement
            player.x += (targetX - player.x) * 0.15;
            
            // Energy Regen
            if (player.energy < 100) player.energy += 0.2;
            document.getElementById('dash-bar').style.width = player.energy + '%';

            // Descent Speed Logic (Weight of Soul)
            score += speed * 0.1;
            
            // Layer Management
            let currentLayer = 0;
            let layerName = "EARTH LAYER";
            if (score > 1000) { currentLayer = 1; layerName = "FORGOTTEN LAYER"; }
            if (score > 2500) { currentLayer = 2; layerName = "SPIRIT LAYER"; }
            
            if (currentLayer !== layer) {
                layer = currentLayer;
                const toast = document.getElementById('layer-msg');
                toast.innerText = layerName;
                toast.style.opacity = 1;
                setTimeout(() => toast.style.opacity = 0, 3000);
            }

            // Update Objects (Move UP to simulate falling)
            
            // 1. Obstacles
            if (obstacles.length < 5) {
                obstacles.push(createObstacle(canvas.height + Math.random() * 200 + 200));
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y -= speed * obs.speedMod;

                // Collision
                let dx = player.x - (obs.x + obs.w/2);
                let dy = player.y - (obs.y + obs.h/2);
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < (player.radius + obs.w/2) && !player.dashing) {
                    gameOver();
                }

                if (obs.y < -100) obstacles.splice(i, 1);
            }

            // 2. Collectibles
            if (Math.random() < 0.02) collectibles.push(createCollectible(canvas.height + 100));

            for (let i = collectibles.length - 1; i >= 0; i--) {
                let c = collectibles[i];
                c.y -= speed;

                // Collision
                let dx = player.x - c.x;
                let dy = player.y - c.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < player.radius + c.radius) {
                    // Collect!
                    if (c.type === 'light') {
                        // Light: Slows down, points
                        speed = Math.max(3, speed - 0.5);
                        for(let k=0; k<5; k++) particles.push(createParticle(c.x, c.y, '#ffd700', -2));
                    } else {
                        // Dark: Speeds up (Weight)
                        speed = Math.min(12, speed + 1.0);
                        for(let k=0; k<5; k++) particles.push(createParticle(c.x, c.y, '#330000', -2));
                    }
                    collectibles.splice(i, 1);
                } else if (c.y < -50) {
                    collectibles.splice(i, 1);
                }
            }

            // 3. Ambient Particles (Ash)
            if (particles.length < 50) {
                particles.push(createParticle(Math.random()*canvas.width, canvas.height + 10, 'rgba(150,150,170,0.3)'));
            }
            
            particles.forEach((p, index) => {
                p.y -= speed * 0.5; // Parallax effect
                p.x += p.speedX;
                p.life -= 0.01;
                if(p.life <= 0 || p.y < -10) particles.splice(index, 1);
            });

            // UI Updates
            document.getElementById('depth-display').innerText = Math.floor(score) + "m";
            const speedText = speed > 7 ? "HEAVY" : (speed < 4 ? "LIGHT" : "NORMAL");
            document.getElementById('speed-display').innerText = speedText;
            document.getElementById('speed-display').style.color = speed > 7 ? "#ff4444" : (speed < 4 ? "#44ffff" : "#d4af37");
        }

        function draw() {
            // Clear Background (Layer Colors)
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (layer === 0) { // Earth
                bgGradient.addColorStop(0, "#050510");
                bgGradient.addColorStop(1, "#1a1a2e");
            } else if (layer === 1) { // Forgotten
                bgGradient.addColorStop(0, "#1a0505");
                bgGradient.addColorStop(1, "#2e1a1a");
            } else { // Spirit
                bgGradient.addColorStop(0, "#000000");
                bgGradient.addColorStop(1, "#0a0a0a");
            }
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = "#000";
                
                // Visual Style based on type
                if (obs.type === 'rock') {
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h/2);
                    ctx.lineTo(obs.x + obs.w/2, obs.y + obs.h);
                    ctx.lineTo(obs.x, obs.y + obs.h);
                    ctx.fill();
                    // Ornament detail
                    ctx.strokeStyle = "#222";
                    ctx.stroke();
                } else if (obs.type === 'root') {
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w/2, obs.y);
                    ctx.bezierCurveTo(obs.x, obs.y + obs.h/2, obs.x + obs.w, obs.y + obs.h/2, obs.x + obs.w/2, obs.y + obs.h);
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = "#111";
                    ctx.stroke();
                } else if (obs.type === 'shadow') {
                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#000";
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.w/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                     // Generic block for others
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
            });

            // Draw Collectibles
            collectibles.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(Date.now() / 200);
                
                if (c.type === 'light') {
                    ctx.fillStyle = "#FFD700";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#FFD700";
                    // Draw diamond (Tamga shape)
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.lineTo(8, 0);
                    ctx.lineTo(0, 10);
                    ctx.lineTo(-8, 0);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#330033";
                    ctx.strokeStyle = "#550055";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI*2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Draw Player
            ctx.save();
            ctx.shadowBlur = player.dashing ? 20 : 10;
            ctx.shadowColor = player.dashing ? "#fff" : "#00ffff";
            ctx.fillStyle = player.dashing ? "#fff" : "#e0f7fa";
            
            // Player Trail
            player.trail.push({x: player.x, y: player.y});
            if (player.trail.length > 10) player.trail.shift();
            
            ctx.beginPath();
            for(let i=0; i<player.trail.length; i++) {
                let t = player.trail[i];
                let scale = i / 10;
                ctx.globalAlpha = scale * 0.5;
                ctx.arc(t.x, t.y - (10-i)*2, player.radius * scale, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Main Player Body
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;
            
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
