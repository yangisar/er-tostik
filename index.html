<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Er Tostik: Descent into the Eternal Abyss</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }

        #gameCanvas {
            display: block;
            background: #0a0a14;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .touch-button {
            position: absolute;
            background: rgba(100, 100, 150, 0.6);
            border: 2px solid rgba(200, 200, 255, 0.8);
            border-radius: 8px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: none;
        }

        .touch-button:active {
            background: rgba(150, 200, 255, 0.8);
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            #gameCanvas {
                width: 100vw !important;
                height: 100vh !important;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // CONFIGURATION & CONSTANTS
        // ============================================================================
        
        const Config = {
            SCREEN_WIDTH: 800,
            SCREEN_HEIGHT: 1200,
            TARGET_FPS: 60,
            
            // Physics
            GRAVITY: 980,
            PLAYER_ACCEL: 800,
            PLAYER_MAX_SPEED: 300,
            PLAYER_JUMP_FORCE: -500,
            FRICTION: 0.85,
            AIR_CONTROL: 0.7,
            WALL_SLIDE_FACTOR: 0.4,
            
            // Player
            PLAYER_WIDTH: 32,
            PLAYER_HEIGHT: 48,
            PLAYER_CRAWL_HEIGHT: 24,
            PLAYER_MAX_HP: 100,
            INVINCIBILITY_TIME: 1.5,
            PLAYER_GLOW_RADIUS: 80,
            
            // Combat
            ATTACK_RANGE: 50,
            ATTACK_WIDTH: 40,
            COMBO_WINDOW: 0.8,
            LIGHT_DAMAGE: 10,
            MEDIUM_DAMAGE: 20,
            HEAVY_DAMAGE: 40,
            STOMP_VELOCITY_THRESHOLD: 300,
            
            // Camera
            CAMERA_LERP_SPEED: 2,
            SCREEN_SHAKE_DECAY: 5,
            
            // Generation
            PLATFORM_BASE_WIDTH: 150,
            PLATFORM_HEIGHT: 20,
            PLATFORM_MIN_GAP: 80,
            PLATFORM_MAX_GAP: 200,
            VERTICAL_SPACING: 150,
            
            // Depth zones
            ZONE_1_END: 500,
            ZONE_2_END: 1500,
            ZONE_3_END: 3000
        };

        // ============================================================================
        // UTILITY CLASSES
        // ============================================================================

        class Vec2 {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }

            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
            mul(s) { return new Vec2(this.x * s, this.y * s); }
            length() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalized() {
                const len = this.length();
                return len > 0 ? new Vec2(this.x / len, this.y / len) : new Vec2(0, 0);
            }
        }

        class Rect {
            constructor(x = 0, y = 0, w = 0, h = 0) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }

            intersects(other) {
                return this.x < other.x + other.w &&
                       this.x + this.w > other.x &&
                       this.y < other.y + other.h &&
                       this.y + this.h > other.y;
            }

            center() {
                return new Vec2(this.x + this.w / 2, this.y + this.h / 2);
            }
        }

        // Color palettes by depth zone
        const Colors = {
            getBackgroundColor(depth) {
                if (depth < Config.ZONE_1_END) {
                    return { r: 26, g: 26, b: 62, a: 255 }; // Deep Indigo
                } else if (depth < Config.ZONE_2_END) {
                    return { r: 15, g: 15, b: 46, a: 255 }; // Violet Void
                } else if (depth < Config.ZONE_3_END) {
                    return { r: 8, g: 8, b: 20, a: 255 }; // Obsidian
                } else {
                    return { r: 0, g: 0, b: 0, a: 255 }; // Pure Black
                }
            },

            getAccentColor(depth) {
                if (depth < Config.ZONE_1_END) {
                    return { r: 0, g: 255, b: 255, a: 255 }; // Cyan
                } else if (depth < Config.ZONE_2_END) {
                    return { r: 255, g: 0, b: 255, a: 255 }; // Magenta
                } else if (depth < Config.ZONE_3_END) {
                    return { r: 255, g: 69, b: 0, a: 255 }; // Blood Orange
                } else {
                    return { r: 204, g: 255, b: 0, a: 255 }; // Sickly Yellow
                }
            },

            toRGBA(c) {
                return `rgba(${c.r}, ${c.g}, ${c.b}, ${c.a / 255})`;
            }
        };

        // Random utilities
        const Random = {
            range(min, max) {
                return Math.random() * (max - min) + min;
            },

            rangeInt(min, max) {
                return Math.floor(this.range(min, max + 1));
            },

            chance(probability) {
                return Math.random() < probability;
            }
        };

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================

        class Particle {
            constructor(pos, vel, color, lifetime, size, type) {
                this.pos = pos;
                this.vel = vel;
                this.color = color;
                this.lifetime = lifetime;
                this.maxLifetime = lifetime;
                this.size = size;
                this.type = type;
            }

            update(dt) {
                this.pos = this.pos.add(this.vel.mul(dt));
                this.vel.y += Config.GRAVITY * dt * 0.3;
                this.lifetime -= dt;

                if (this.type === 'SOUL') {
                    this.vel.y -= 50 * dt;
                }
            }

            isAlive() {
                return this.lifetime > 0;
            }

            getAlpha() {
                return Math.min(1, this.lifetime / this.maxLifetime);
            }
        }

        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.MAX_PARTICLES = 300;
            }

            emit(pos, vel, color, lifetime, size, type, count = 1) {
                for (let i = 0; i < count; i++) {
                    if (this.particles.length >= this.MAX_PARTICLES) {
                        this.particles.shift();
                    }

                    const randomVel = new Vec2(
                        vel.x + Random.range(-50, 50),
                        vel.y + Random.range(-50, 50)
                    );

                    this.particles.push(new Particle(pos, randomVel, color, lifetime, size, type));
                }
            }

            update(dt) {
                this.particles.forEach(p => p.update(dt));
                this.particles = this.particles.filter(p => p.isAlive());
            }

            clear() {
                this.particles = [];
            }
        }

        // ============================================================================
        // SCARF PHYSICS
        // ============================================================================

        class ScarfChain {
            constructor() {
                this.SEGMENTS = 8;
                this.SEGMENT_LENGTH = 6;
                this.DRAG_FACTOR = 0.3;
                this.segments = [];

                for (let i = 0; i < this.SEGMENTS; i++) {
                    this.segments.push({
                        pos: new Vec2(),
                        oldPos: new Vec2()
                    });
                }
            }

            update(anchorPos, velocity, dt) {
                this.segments[0].pos = anchorPos;

                for (let i = 1; i < this.SEGMENTS; i++) {
                    const targetPos = this.segments[i - 1].pos;
                    const dir = this.segments[i].pos.sub(targetPos);
                    const dist = dir.length();

                    if (dist > 0) {
                        const normalized = dir.mul(1 / dist);
                        this.segments[i].pos = targetPos.add(normalized.mul(this.SEGMENT_LENGTH));
                    }

                    const movement = this.segments[i].pos.sub(this.segments[i].oldPos);
                    this.segments[i].oldPos = this.segments[i].pos;
                    this.segments[i].pos = this.segments[i].pos.add(movement.mul(this.DRAG_FACTOR));
                    this.segments[i].pos.y += Config.GRAVITY * dt * 0.1;

                    const influence = 1 - i / this.SEGMENTS;
                    this.segments[i].pos = this.segments[i].pos.add(velocity.mul(dt * 0.1 * influence));
                }
            }
        }

        // ============================================================================
        // GAME ENTITIES
        // ============================================================================

        class Platform {
            constructor(x, y, width, type = 'STONE_SLAB') {
                this.bounds = new Rect(x, y, width, Config.PLATFORM_HEIGHT);
                this.type = type;
                this.crumbleTimer = 0;
                this.isCrumbling = false;
                this.crystalPositions = [];

                if (type === 'CRYSTAL_BRIDGE' || Random.chance(0.3)) {
                    const numCrystals = Random.rangeInt(2, 4);
                    for (let i = 0; i < numCrystals; i++) {
                        this.crystalPositions.push(new Vec2(
                            this.bounds.x + Random.range(10, this.bounds.w - 10),
                            this.bounds.y
                        ));
                    }
                }
            }

            update(dt) {
                if (this.isCrumbling) {
                    this.crumbleTimer += dt;
                }
            }

            shouldDestroy() {
                return this.isCrumbling && this.crumbleTimer > 1;
            }

            startCrumble() {
                if (this.type === 'CRUMBLING' && !this.isCrumbling) {
                    this.isCrumbling = true;
                }
            }

            getOpacity() {
                if (this.type === 'CRYSTAL_BRIDGE') return 0.5;
                if (this.isCrumbling) return 1 - this.crumbleTimer;
                return 1;
            }
        }

        class Enemy {
            constructor(pos, type, platformLeft, platformRight) {
                this.pos = pos;
                this.vel = new Vec2(0, 0);
                this.type = type;
                this.direction = 1;
                this.patrolLeft = platformLeft;
                this.patrolRight = platformRight;
                this.attackCooldown = 0;
                this.isAlive = true;

                switch (type) {
                    case 'SHADOW_WALKER':
                        this.bounds = new Rect(pos.x - 16, pos.y - 32, 32, 32);
                        this.hp = this.maxHp = 30;
                        break;
                    case 'BONE_CRAWLER':
                        this.bounds = new Rect(pos.x - 20, pos.y - 24, 40, 24);
                        this.hp = this.maxHp = 50;
                        break;
                    case 'VOID_SENTINEL':
                        this.bounds = new Rect(pos.x - 24, pos.y - 24, 48, 48);
                        this.hp = this.maxHp = 80;
                        break;
                }
            }

            update(dt, playerPos) {
                if (!this.isAlive) return;

                this.attackCooldown = Math.max(0, this.attackCooldown - dt);

                switch (this.type) {
                    case 'SHADOW_WALKER':
                        this.updateShadowWalker(dt);
                        break;
                    case 'BONE_CRAWLER':
                        this.updateBoneCrawler(dt, playerPos);
                        break;
                    case 'VOID_SENTINEL':
                        this.updateVoidSentinel(dt);
                        break;
                }

                this.bounds.x = this.pos.x - this.bounds.w / 2;
                this.bounds.y = this.pos.y - this.bounds.h;
            }

            updateShadowWalker(dt) {
                this.pos.x += this.direction * 50 * dt;
                if (this.pos.x <= this.patrolLeft || this.pos.x >= this.patrolRight) {
                    this.direction *= -1;
                }
            }

            updateBoneCrawler(dt, playerPos) {
                if (playerPos.y > this.pos.y && Math.abs(playerPos.x - this.pos.x) < 100) {
                    this.direction = playerPos.x < this.pos.x ? -1 : 1;
                }

                this.pos.x += this.direction * 80 * dt;
                if (this.pos.x <= this.patrolLeft || this.pos.x >= this.patrolRight) {
                    this.direction *= -1;
                }
            }

            updateVoidSentinel(dt) {
                this.pos.y += Math.sin(Date.now() / 500) * 0.5;
            }

            takeDamage(damage) {
                this.hp -= damage;
                if (this.hp <= 0) {
                    this.isAlive = false;
                }
            }
        }

        class Player {
            constructor(x, y) {
                this.pos = new Vec2(x, y);
                this.vel = new Vec2(0, 0);
                this.scarf = new ScarfChain();

                this.hp = Config.PLAYER_MAX_HP;
                this.maxHp = Config.PLAYER_MAX_HP;
                this.souls = 0;
                this.depth = 0;

                this.onGround = false;
                this.isCrawling = false;
                this.isAttacking = false;
                this.comboCount = 0;
                this.comboTimer = 0;
                this.attackTimer = 0;
                this.invincibilityTimer = 0;

                this.animTimer = 0;
                this.animFrame = 0;
                this.facingRight = true;

                this.updateBounds();
            }

            updateBounds() {
                const height = this.isCrawling ? Config.PLAYER_CRAWL_HEIGHT : Config.PLAYER_HEIGHT;
                this.bounds = new Rect(
                    this.pos.x - Config.PLAYER_WIDTH / 2,
                    this.pos.y - height,
                    Config.PLAYER_WIDTH,
                    height
                );
            }

            update(dt) {
                this.comboTimer = Math.max(0, this.comboTimer - dt);
                this.attackTimer = Math.max(0, this.attackTimer - dt);
                this.invincibilityTimer = Math.max(0, this.invincibilityTimer - dt);

                if (this.comboTimer <= 0 && this.comboCount > 0) {
                    this.comboCount = 0;
                }

                if (this.attackTimer <= 0) {
                    this.isAttacking = false;
                }

                this.animTimer += dt;
                if (this.animTimer > 0.15) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }

                this.scarf.update(
                    new Vec2(this.pos.x, this.pos.y - this.bounds.h * 0.7),
                    this.vel,
                    dt
                );

                this.depth = Math.max(this.depth, -this.pos.y);
            }

            takeDamage(damage) {
                if (this.invincibilityTimer > 0) return;
                this.hp = Math.max(0, this.hp - damage);
                this.invincibilityTimer = Config.INVINCIBILITY_TIME;
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                this.attackTimer = 0.3;
                this.comboTimer = Config.COMBO_WINDOW;
                this.comboCount = Math.min(this.comboCount + 1, 3);
            }

            getAttackDamage() {
                switch (this.comboCount) {
                    case 1: return Config.LIGHT_DAMAGE;
                    case 2: return Config.MEDIUM_DAMAGE;
                    case 3: return Config.HEAVY_DAMAGE;
                    default: return Config.LIGHT_DAMAGE;
                }
            }

            getAttackHitbox() {
                const range = Config.ATTACK_RANGE + this.comboCount * 10;
                const xOffset = this.facingRight ? Config.PLAYER_WIDTH / 2 : -range - Config.PLAYER_WIDTH / 2;
                return new Rect(this.pos.x + xOffset, this.bounds.y, range, this.bounds.h);
            }

            isInvincible() {
                return this.invincibilityTimer > 0;
            }
        }

        // ============================================================================
        // CAMERA
        // ============================================================================

        class Camera {
            constructor() {
                this.pos = new Vec2(Config.SCREEN_WIDTH / 2, Config.SCREEN_HEIGHT / 2);
                this.shake = new Vec2(0, 0);
                this.shakeIntensity = 0;
                this.minY = Config.SCREEN_HEIGHT / 2;
            }

            update(targetPos, dt) {
                const targetY = targetPos.y;
                if (targetY < this.minY) {
                    this.minY = targetY;
                }

                this.pos.x += (targetPos.x - this.pos.x) * Config.CAMERA_LERP_SPEED * dt;
                this.pos.y += (this.minY - this.pos.y) * Config.CAMERA_LERP_SPEED * dt;

                if (this.shakeIntensity > 0) {
                    this.shake.x = Random.range(-this.shakeIntensity, this.shakeIntensity);
                    this.shake.y = Random.range(-this.shakeIntensity, this.shakeIntensity);
                    this.shakeIntensity -= Config.SCREEN_SHAKE_DECAY * dt;
                    if (this.shakeIntensity < 0) this.shakeIntensity = 0;
                }
            }

            addShake(intensity) {
                this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
            }

            getPosition() {
                return this.pos.add(this.shake);
            }

            worldToScreen(point) {
                const camPos = this.getPosition();
                if (point instanceof Vec2) {
                    return new Vec2(
                        point.x - camPos.x + Config.SCREEN_WIDTH / 2,
                        point.y - camPos.y + Config.SCREEN_HEIGHT / 2
                    );
                } else {
                    return {
                        x: point.x - camPos.x + Config.SCREEN_WIDTH / 2,
                        y: point.y - camPos.y + Config.SCREEN_HEIGHT / 2,
                        w: point.w,
                        h: point.h
                    };
                }
            }
        }

        // ============================================================================
        // LEVEL GENERATOR
        // ============================================================================

        class LevelGenerator {
            constructor() {
                this.currentY = 0;
                this.difficulty = 0;
            }

            reset() {
                this.currentY = 0;
                this.difficulty = 0;
            }

            generatePlatform(depth) {
                this.difficulty = depth * 0.0001;

                const minGap = Config.PLATFORM_MIN_GAP + this.difficulty * 50;
                const maxGap = Config.PLATFORM_MAX_GAP + this.difficulty * 100;
                const gap = Random.range(minGap, maxGap);

                this.currentY += gap;

                const baseWidth = Config.PLATFORM_BASE_WIDTH;
                const widthVariation = Math.max(0, 1 - this.difficulty * 0.5);
                const width = baseWidth * Random.range(0.5 * widthVariation, 1.2);

                const x = Random.range(width / 2 + 50, Config.SCREEN_WIDTH - width / 2 - 50);

                let type = 'STONE_SLAB';
                const typeRoll = Random.range(0, 1);

                if (depth > 300) {
                    if (typeRoll < 0.15) type = 'CRUMBLING';
                    else if (typeRoll < 0.25) type = 'CRYSTAL_BRIDGE';
                    else if (typeRoll < 0.35 && depth > 800) type = 'JAGGED_SPIKE';
                }

                return new Platform(x - width / 2, this.currentY, width, type);
            }

            trySpawnEnemy(platform, depth) {
                const spawnChance = 0.3 + this.difficulty * 0.5;
                if (!Random.chance(spawnChance)) return null;

                let type = 'SHADOW_WALKER';

                if (depth > Config.ZONE_1_END) {
                    const typeRoll = Random.range(0, 1);
                    if (typeRoll < 0.4) type = 'BONE_CRAWLER';
                    else if (typeRoll < 0.6 && depth > Config.ZONE_2_END) type = 'VOID_SENTINEL';
                }

                const spawnPos = new Vec2(platform.bounds.center().x, platform.bounds.y);
                return new Enemy(spawnPos, type, platform.bounds.x, platform.bounds.x + platform.bounds.w);
            }
        }

        // ============================================================================
        // RENDERER
        // ============================================================================

        class Renderer {
            constructor(ctx) {
                this.ctx = ctx;
            }

            clear(color) {
                this.ctx.fillStyle = Colors.toRGBA(color);
                this.ctx.fillRect(0, 0, Config.SCREEN_WIDTH, Config.SCREEN_HEIGHT);
            }

            drawRect(rect, color, filled = true) {
                this.ctx.fillStyle = Colors.toRGBA(color);
                this.ctx.strokeStyle = Colors.toRGBA(color);

                if (filled) {
                    this.ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                } else {
                    this.ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                }
            }

            drawCircle(x, y, radius, color, filled = true) {
                this.ctx.fillStyle = Colors.toRGBA(color);
                this.ctx.strokeStyle = Colors.toRGBA(color);
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                if (filled) {
                    this.ctx.fill();
                } else {
                    this.ctx.stroke();
                }
            }

            drawLine(p1, p2, color, width = 1) {
                this.ctx.strokeStyle = Colors.toRGBA(color);
                this.ctx.lineWidth = width;
                this.ctx.beginPath();
                this.ctx.moveTo(p1.x, p1.y);
                this.ctx.lineTo(p2.x, p2.y);
                this.ctx.stroke();
                this.ctx.lineWidth = 1;
            }

            drawGlow(pos, radius, color, intensity = 1) {
                const steps = 15;
                for (let i = steps; i > 0; i--) {
                    const t = i / steps;
                    const alpha = color.a * intensity * (1 - t) * t;
                    const glowColor = { ...color, a: Math.min(255, alpha) };
                    this.drawCircle(pos.x, pos.y, radius * t, glowColor, true);
                }
            }

            drawVignette(depth) {
                const intensity = Math.min(1, depth / 1000) * 0.7;
                const steps = 30;

                for (let i = 0; i < steps; i++) {
                    const t = i / steps;
                    const alpha = 255 * intensity * t;
                    const vignetteColor = { r: 0, g: 0, b: 0, a: alpha };

                    // Top/bottom
                    this.drawRect({
                        x: 0,
                        y: i * Config.SCREEN_HEIGHT / steps / 2,
                        w: Config.SCREEN_WIDTH,
                        h: 2
                    }, vignetteColor);

                    this.drawRect({
                        x: 0,
                        y: Config.SCREEN_HEIGHT - i * Config.SCREEN_HEIGHT / steps / 2,
                        w: Config.SCREEN_WIDTH,
                        h: 2
                    }, vignetteColor);

                    // Left/right
                    this.drawRect({
                        x: i * Config.SCREEN_WIDTH / steps / 2,
                        y: 0,
                        w: 2,
                        h: Config.SCREEN_HEIGHT
                    }, vignetteColor);

                    this.drawRect({
                        x: Config.SCREEN_WIDTH - i * Config.SCREEN_WIDTH / steps / 2,
                        y: 0,
                        w: 2,
                        h: Config.SCREEN_HEIGHT
                    }, vignetteColor);
                }
            }

            drawText(text, x, y, color, size = 20, align = 'left') {
                this.ctx.fillStyle = Colors.toRGBA(color);
                this.ctx.font = `bold ${size}px Courier New`;
                this.ctx.textAlign = align;
                this.ctx.fillText(text, x, y);
            }
        }

        // ============================================================================
        // INPUT HANDLER
        // ============================================================================

        class InputHandler {
            constructor() {
                this.state = {
                    left: false,
                    right: false,
                    up: false,
                    down: false,
                    attack: false,
                    leftPressed: false,
                    rightPressed: false,
                    jumpPressed: false,
                    attackPressed: false
                };

                this.setupEventListeners();
            }

            setupEventListeners() {
                // Keyboard
                window.addEventListener('keydown', (e) => {
                    switch (e.key) {
                        case 'ArrowLeft':
                            this.state.left = true;
                            this.state.leftPressed = true;
                            break;
                        case 'ArrowRight':
                            this.state.right = true;
                            this.state.rightPressed = true;
                            break;
                        case 'ArrowUp':
                            this.state.up = true;
                            this.state.jumpPressed = true;
                            break;
                        case 'ArrowDown':
                            this.state.down = true;
                            break;
                        case 'z':
                        case 'Z':
                        case ' ':
                            this.state.attack = true;
                            this.state.attackPressed = true;
                            e.preventDefault();
                            break;
                    }
                });

                window.addEventListener('keyup', (e) => {
                    switch (e.key) {
                        case 'ArrowLeft':
                            this.state.left = false;
                            break;
                        case 'ArrowRight':
                            this.state.right = false;
                            break;
                        case 'ArrowUp':
                            this.state.up = false;
                            break;
                        case 'ArrowDown':
                            this.state.down = false;
                            break;
                        case 'z':
                        case 'Z':
                        case ' ':
                            this.state.attack = false;
                            break;
                    }
                });

                // Touch/Mouse for on-screen buttons
                this.touchButtons = this.createTouchButtons();
            }

            createTouchButtons() {
                const buttonSize = 80;
                const padding = 20;
                const bottomY = Config.SCREEN_HEIGHT - buttonSize - padding;

                return [
                    { bounds: new Rect(padding, bottomY - buttonSize - 10, buttonSize, buttonSize), 
                      key: 'up', label: '↑' },
                    { bounds: new Rect(padding, bottomY, buttonSize / 2, buttonSize), 
                      key: 'left', label: '←' },
                    { bounds: new Rect(padding + buttonSize / 2, bottomY, buttonSize / 2, buttonSize), 
                      key: 'right', label: '→' },
                    { bounds: new Rect(padding + buttonSize / 2 - buttonSize / 4, bottomY + buttonSize + 10, buttonSize / 2, buttonSize / 2), 
                      key: 'down', label: '↓' },
                    { bounds: new Rect(Config.SCREEN_WIDTH - buttonSize * 2 - padding, bottomY, buttonSize * 2, buttonSize), 
                      key: 'attack', label: 'ATTACK' }
                ];
            }

            handleTouch(x, y, isDown) {
                for (const btn of this.touchButtons) {
                    if (x >= btn.bounds.x && x < btn.bounds.x + btn.bounds.w &&
                        y >= btn.bounds.y && y < btn.bounds.y + btn.bounds.h) {
                        
                        this.state[btn.key] = isDown;
                        if (isDown) {
                            if (btn.key === 'up') this.state.jumpPressed = true;
                            else if (btn.key === 'left') this.state.leftPressed = true;
                            else if (btn.key === 'right') this.state.rightPressed = true;
                            else if (btn.key === 'attack') this.state.attackPressed = true;
                        }
                    }
                }
            }

            update() {
                this.state.leftPressed = false;
                this.state.rightPressed = false;
                this.state.jumpPressed = false;
                this.state.attackPressed = false;
            }

            render(renderer) {
                for (const btn of this.touchButtons) {
                    const color = this.state[btn.key] ? 
                        { r: 150, g: 200, b: 255, a: 200 } : 
                        { r: 100, g: 100, b: 150, a: 150 };
                    
                    renderer.drawRect(btn.bounds, color, true);
                    renderer.drawRect(btn.bounds, { r: 200, g: 200, b: 255, a: 255 }, false);
                    renderer.drawText(btn.label, 
                        btn.bounds.x + btn.bounds.w / 2, 
                        btn.bounds.y + btn.bounds.h / 2 + 7, 
                        { r: 255, g: 255, b: 255, a: 255 }, 
                        20, 
                        'center'
                    );
                }
            }
        }

        // ============================================================================
        // GAME MANAGER
        // ============================================================================

        class Game {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.renderer = new Renderer(this.ctx);

                this.state = 'PLAYING';
                this.player = new Player(Config.SCREEN_WIDTH / 2, 100);
                this.camera = new Camera();
                this.input = new InputHandler();
                this.particles = new ParticleSystem();
                this.levelGen = new LevelGenerator();

                this.platforms = [];
                this.enemies = [];

                this.enemiesSlain = 0;
                this.timeSurvived = 0;

                this.initLevel();
                this.setupTouchEvents();
                this.lastTime = performance.now();
                this.accumulator = 0;
            }

            initLevel() {
                this.platforms = [];
                this.enemies = [];
                this.particles.clear();
                this.levelGen.reset();

                for (let i = 0; i < 20; i++) {
                    const platform = this.levelGen.generatePlatform(this.player.depth);
                    this.platforms.push(platform);

                    const enemy = this.levelGen.trySpawnEnemy(platform, this.player.depth);
                    if (enemy) {
                        this.enemies.push(enemy);
                    }
                }
            }

            setupTouchEvents() {
                const handleTouchStart = (e) => {
                    e.preventDefault();
                    for (let i = 0; i < e.touches.length; i++) {
                        const touch = e.touches[i];
                        const rect = this.canvas.getBoundingClientRect();
                        const x = (touch.clientX - rect.left) * (Config.SCREEN_WIDTH / rect.width);
                        const y = (touch.clientY - rect.top) * (Config.SCREEN_HEIGHT / rect.height);
                        this.input.handleTouch(x, y, true);
                    }
                };

                const handleTouchEnd = (e) => {
                    e.preventDefault();
                    this.input.state.left = false;
                    this.input.state.right = false;
                    this.input.state.up = false;
                    this.input.state.down = false;
                    this.input.state.attack = false;
                };

                const handleTouchMove = (e) => {
                    e.preventDefault();
                    handleTouchStart(e);
                };

                this.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                this.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
                this.canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
                this.canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

                // Mouse events for desktop testing
                let mouseDown = false;
                this.canvas.addEventListener('mousedown', (e) => {
                    mouseDown = true;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (Config.SCREEN_WIDTH / rect.width);
                    const y = (e.clientY - rect.top) * (Config.SCREEN_HEIGHT / rect.height);
                    this.input.handleTouch(x, y, true);
                });

                this.canvas.addEventListener('mouseup', () => {
                    mouseDown = false;
                    this.input.state.left = false;
                    this.input.state.right = false;
                    this.input.state.up = false;
                    this.input.state.down = false;
                    this.input.state.attack = false;
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    if (mouseDown) {
                        const rect = this.canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (Config.SCREEN_WIDTH / rect.width);
                        const y = (e.clientY - rect.top) * (Config.SCREEN_HEIGHT / rect.height);
                        this.input.handleTouch(x, y, true);
                    }
                });
            }

            update(dt) {
                if (this.state !== 'PLAYING') return;

                this.timeSurvived += dt;

                // Player movement
                let accel = Config.PLAYER_ACCEL;
                if (!this.player.onGround) {
                    accel *= Config.AIR_CONTROL;
                }

                if (this.input.state.left) {
                    this.player.vel.x -= accel * dt;
                    this.player.facingRight = false;
                }
                if (this.input.state.right) {
                    this.player.vel.x += accel * dt;
                    this.player.facingRight = true;
                }

                this.player.vel.x = Math.max(-Config.PLAYER_MAX_SPEED, 
                    Math.min(Config.PLAYER_MAX_SPEED, this.player.vel.x));

                if (this.player.onGround) {
                    this.player.vel.x *= Config.FRICTION;
                }

                this.player.vel.y += Config.GRAVITY * dt;

                this.player.isCrawling = this.input.state.down && this.player.onGround;

                if (this.input.state.jumpPressed && this.player.onGround) {
                    if (this.input.state.down) {
                        this.player.pos.y += 5;
                    } else {
                        this.player.vel.y = Config.PLAYER_JUMP_FORCE;
                        this.particles.emit(this.player.pos, new Vec2(0, 50), 
                            { r: 200, g: 200, b: 200, a: 255 }, 0.5, 4, 'DUST', 8);
                    }
                    this.player.onGround = false;
                }

                if (this.input.state.attackPressed) {
                    this.player.attack();
                    this.camera.addShake(3);
                }

                // Wall slide
                if (this.player.pos.x < 30 || this.player.pos.x > Config.SCREEN_WIDTH - 30) {
                    this.player.vel.y *= Config.WALL_SLIDE_FACTOR;
                    this.player.vel.x *= -0.5;
                }

                this.player.pos.x += this.player.vel.x * dt;
                this.player.pos.y += this.player.vel.y * dt;

                this.player.pos.x = Math.max(30, Math.min(Config.SCREEN_WIDTH - 30, this.player.pos.x));

                this.player.updateBounds();

                // Platform collision
                this.player.onGround = false;
                for (const platform of this.platforms) {
                    if (platform.shouldDestroy()) continue;

                    if (this.player.vel.y > 0 && this.player.bounds.intersects(platform.bounds)) {
                        const bottomOverlap = (this.player.bounds.y + this.player.bounds.h) - platform.bounds.y;

                        if (bottomOverlap < 20 && bottomOverlap > 0) {
                            this.player.pos.y = platform.bounds.y - this.player.bounds.h;
                            this.player.vel.y = 0;
                            this.player.onGround = true;
                            this.player.updateBounds();

                            if (platform.type === 'CRUMBLING') {
                                platform.startCrumble();
                            }

                            if (platform.type === 'JAGGED_SPIKE' && this.player.vel.y > 200) {
                                this.player.takeDamage(10);
                                this.camera.addShake(5);
                                this.particles.emit(this.player.pos, new Vec2(0, -50), 
                                    { r: 255, g: 0, b: 0, a: 255 }, 0.8, 6, 'BLOOD', 10);
                            }
                        }
                    }
                }

                // Combat
                if (this.player.isAttacking) {
                    const attackBox = this.player.getAttackHitbox();
                    const damage = this.player.getAttackDamage();

                    for (const enemy of this.enemies) {
                        if (!enemy.isAlive) continue;

                        if (attackBox.intersects(enemy.bounds)) {
                            enemy.takeDamage(damage);
                            this.camera.addShake(this.player.comboCount * 2);

                            const accentColor = Colors.getAccentColor(this.player.depth);
                            this.particles.emit(enemy.pos, 
                                new Vec2(this.player.facingRight ? 50 : -50, -50),
                                accentColor, 0.6, 8, 'SPARK', 15);

                            if (!enemy.isAlive) {
                                this.enemiesSlain++;
                                this.player.souls += 5;
                                this.particles.emit(enemy.pos, new Vec2(0, -80),
                                    { r: 255, g: 215, b: 0, a: 255 }, 1.2, 10, 'SOUL', 8);
                            }
                        }
                    }
                }

                // Stomp
                if (this.player.vel.y > Config.STOMP_VELOCITY_THRESHOLD) {
                    for (const enemy of this.enemies) {
                        if (!enemy.isAlive) continue;

                        const stompBox = new Rect(
                            this.player.bounds.x,
                            this.player.bounds.y + this.player.bounds.h - 10,
                            this.player.bounds.w,
                            10
                        );

                        if (stompBox.intersects(enemy.bounds)) {
                            enemy.takeDamage(50);
                            this.player.vel.y = Config.PLAYER_JUMP_FORCE * 0.6;
                            this.camera.addShake(8);

                            this.particles.emit(enemy.pos, new Vec2(0, -100),
                                { r: 255, g: 100, b: 100, a: 255 }, 0.8, 10, 'BLOOD', 20);

                            if (!enemy.isAlive) {
                                this.enemiesSlain++;
                                this.player.souls += 5;
                            }
                        }
                    }
                }

                // Enemy updates
                for (const enemy of this.enemies) {
                    enemy.update(dt, this.player.pos);

                    if (enemy.isAlive && !this.player.isInvincible() && 
                        this.player.bounds.intersects(enemy.bounds)) {
                        this.player.takeDamage(15);
                        this.camera.addShake(6);
                        this.particles.emit(this.player.pos, new Vec2(0, -50),
                            { r: 255, g: 50, b: 50, a: 255 }, 0.8, 6, 'BLOOD', 12);
                    }
                }

                // Update platforms
                for (const platform of this.platforms) {
                    platform.update(dt);
                }

                // Remove destroyed
                this.platforms = this.platforms.filter(p => !p.shouldDestroy());
                this.enemies = this.enemies.filter(e => e.isAlive);

                // Generate new platforms
                while (this.platforms.length < 25) {
                    const platform = this.levelGen.generatePlatform(this.player.depth);
                    this.platforms.push(platform);

                    const enemy = this.levelGen.trySpawnEnemy(platform, this.player.depth);
                    if (enemy) {
                        this.enemies.push(enemy);
                    }
                }

                this.player.update(dt);
                this.camera.update(this.player.pos, dt);
                this.particles.update(dt);
                this.input.update();

                if (this.player.hp <= 0) {
                    this.state = 'GAME_OVER';
                }
            }

            render() {
                const bgColor = Colors.getBackgroundColor(this.player.depth);
                this.renderer.clear(bgColor);

                this.renderParallaxBackground();

                for (const platform of this.platforms) {
                    this.renderPlatform(platform);
                }

                for (const enemy of this.enemies) {
                    this.renderEnemy(enemy);
                }

                this.renderPlayer();

                for (const particle of this.particles.particles) {
                    this.renderParticle(particle);
                }

                this.renderer.drawVignette(this.player.depth);
                this.renderUI();
                this.input.render(this.renderer);

                if (this.state === 'GAME_OVER') {
                    this.renderGameOver();
                }
            }

            renderParallaxBackground() {
                const accentColor = Colors.getAccentColor(this.player.depth);

                // Seed for consistent stars
                let seed = 42;
                const seededRandom = () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };

                for (let i = 0; i < 50; i++) {
                    const x = seededRandom() * Config.SCREEN_WIDTH;
                    const baseY = seededRandom() * 5000;
                    const parallaxY = baseY + this.player.depth * 0.3;

                    const screenPos = this.camera.worldToScreen(new Vec2(x, parallaxY));

                    if (screenPos.y > -50 && screenPos.y < Config.SCREEN_HEIGHT + 50) {
                        const size = Math.floor(seededRandom() * 2) + 1;
                        const starColor = { ...accentColor, a: Math.floor(seededRandom() * 100) + 100 };
                        this.renderer.drawCircle(screenPos.x, screenPos.y, size, starColor, true);
                    }
                }
            }

            renderPlatform(platform) {
                const screenRect = this.camera.worldToScreen(platform.bounds);
                const opacity = platform.getOpacity();
                const accentColor = Colors.getAccentColor(this.player.depth);

                let platformColor;
                if (platform.type === 'CRYSTAL_BRIDGE') {
                    platformColor = { r: accentColor.r, g: accentColor.g, b: accentColor.b, a: 128 * opacity };
                } else if (platform.type === 'JAGGED_SPIKE') {
                    platformColor = { r: 100, g: 50, b: 50, a: 255 * opacity };
                } else if (platform.type === 'CRUMBLING') {
                    platformColor = { r: 80, g: 80, b: 60, a: 255 * opacity };
                } else {
                    platformColor = { r: 60, g: 60, b: 80, a: 255 * opacity };
                }

                this.renderer.drawRect(screenRect, platformColor, true);

                const edgeColor = { ...accentColor, a: 180 * opacity };
                this.renderer.drawRect({ x: screenRect.x, y: screenRect.y, w: screenRect.w, h: 2 }, edgeColor, true);

                for (const crystal of platform.crystalPositions) {
                    const screenPos = this.camera.worldToScreen(crystal);
                    this.renderer.drawGlow(screenPos, 15, accentColor, 0.5 * opacity);
                }

                if (platform.type === 'JAGGED_SPIKE') {
                    for (let x = screenRect.x; x < screenRect.x + screenRect.w; x += 15) {
                        this.renderer.drawLine(
                            new Vec2(x, screenRect.y),
                            new Vec2(x + 7, screenRect.y - 10),
                            { r: 150, g: 80, b: 80, a: 255 * opacity },
                            2
                        );
                    }
                }
            }

            renderEnemy(enemy) {
                if (!enemy.isAlive) return;

                const screenRect = this.camera.worldToScreen(enemy.bounds);
                const accentColor = Colors.getAccentColor(this.player.depth);

                switch (enemy.type) {
                    case 'SHADOW_WALKER':
                        this.renderer.drawRect(screenRect, { r: 40, g: 40, b: 60, a: 255 }, true);
                        this.renderer.drawCircle(screenRect.x + screenRect.w * 0.3, 
                            screenRect.y + screenRect.h * 0.4, 3, { r: 255, g: 0, b: 0, a: 255 }, true);
                        this.renderer.drawCircle(screenRect.x + screenRect.w * 0.7, 
                            screenRect.y + screenRect.h * 0.4, 3, { r: 255, g: 0, b: 0, a: 255 }, true);
                        break;

                    case 'BONE_CRAWLER':
                        this.renderer.drawRect(screenRect, { r: 220, g: 220, b: 200, a: 255 }, false);
                        for (let i = 0; i < 3; i++) {
                            const segment = {
                                x: screenRect.x + i * screenRect.w / 3,
                                y: screenRect.y,
                                w: screenRect.w / 3,
                                h: screenRect.h
                            };
                            this.renderer.drawRect(segment, { r: 200, g: 200, b: 180, a: 255 }, false);
                        }
                        break;

                    case 'VOID_SENTINEL':
                        this.renderer.drawCircle(screenRect.x + screenRect.w / 2, 
                            screenRect.y + screenRect.h / 2, 
                            screenRect.w / 2, { r: 80, g: 40, b: 100, a: 255 }, true);
                        this.renderer.drawGlow(
                            new Vec2(screenRect.x + screenRect.w / 2, screenRect.y + screenRect.h / 2),
                            30, accentColor, 0.8
                        );

                        const angle = Date.now() / 1000;
                        for (let i = 0; i < 3; i++) {
                            const a = angle + i * 2.0944;
                            const runePos = new Vec2(
                                screenRect.x + screenRect.w / 2 + Math.cos(a) * 30,
                                screenRect.y + screenRect.h / 2 + Math.sin(a) * 30
                            );
                            this.renderer.drawCircle(runePos.x, runePos.y, 4, accentColor, true);
                        }
                        break;
                }

                if (enemy.hp < enemy.maxHp) {
                    const healthBg = { x: screenRect.x, y: screenRect.y - 10, w: screenRect.w, h: 4 };
                    const healthFg = { x: screenRect.x, y: screenRect.y - 10, 
                        w: screenRect.w * enemy.hp / enemy.maxHp, h: 4 };
                    this.renderer.drawRect(healthBg, { r: 50, g: 50, b: 50, a: 255 }, true);
                    this.renderer.drawRect(healthFg, { r: 200, g: 50, b: 50, a: 255 }, true);
                }
            }

            renderPlayer() {
                const screenRect = this.camera.worldToScreen(this.player.bounds);
                const accentColor = Colors.getAccentColor(this.player.depth);

                const glowPos = this.camera.worldToScreen(
                    new Vec2(this.player.pos.x, this.player.pos.y - this.player.bounds.h / 2)
                );
                this.renderer.drawGlow(glowPos, Config.PLAYER_GLOW_RADIUS, accentColor, 0.6);

                // Scarf
                const segments = this.player.scarf.segments;
                for (let i = 1; i < segments.length; i++) {
                    const p1 = this.camera.worldToScreen(segments[i - 1].pos);
                    const p2 = this.camera.worldToScreen(segments[i].pos);

                    const t = i / segments.length;
                    const scarfColor = {
                        r: 255 * (1 - t) + accentColor.r * t,
                        g: 255 * (1 - t) + accentColor.g * t,
                        b: 255 * (1 - t) + accentColor.b * t,
                        a: 200
                    };

                    this.renderer.drawLine(p1, p2, scarfColor, 3);
                }

                let playerColor = accentColor;
                if (this.player.isInvincible() && Math.floor(Date.now() / 100) % 2 === 0) {
                    playerColor = { r: 255, g: 255, b: 255, a: 255 };
                }

                this.renderer.drawRect(screenRect, playerColor, true);

                const faceRect = {
                    x: this.player.facingRight ? screenRect.x + screenRect.w - 5 : screenRect.x,
                    y: screenRect.y + screenRect.h / 3,
                    w: 5,
                    h: screenRect.h / 3
                };
                this.renderer.drawRect(faceRect, { r: 255, g: 255, b: 255, a: 255 }, true);

                if (this.player.isAttacking) {
                    const attackBox = this.player.getAttackHitbox();
                    const slashRect = this.camera.worldToScreen(attackBox);

                    const slashColor = { ...accentColor, a: 150 };
                    const arcSize = 10 + this.player.comboCount * 10;

                    for (let i = 0; i < arcSize; i++) {
                        const angle = (i / arcSize) * Math.PI - Math.PI / 2;
                        const x = slashRect.x + slashRect.w / 2 + Math.cos(angle) * slashRect.w / 2;
                        const y = slashRect.y + slashRect.h / 2 + Math.sin(angle) * slashRect.h / 2;
                        this.renderer.drawCircle(x, y, 3 + this.player.comboCount, slashColor, true);
                    }
                }

                if (this.player.comboCount > 0 && this.player.comboTimer > 0) {
                    const comboBar = {
                        x: screenRect.x,
                        y: screenRect.y - 20,
                        w: screenRect.w * this.player.comboTimer / Config.COMBO_WINDOW,
                        h: 4
                    };
                    this.renderer.drawRect(comboBar, accentColor, true);

                    for (let i = 0; i < this.player.comboCount; i++) {
                        this.renderer.drawCircle(screenRect.x + 10 + i * 15, screenRect.y - 30, 
                            5, accentColor, true);
                    }
                }
            }

            renderParticle(particle) {
                const screenPos = this.camera.worldToScreen(particle.pos);

                if (screenPos.y < -50 || screenPos.y > Config.SCREEN_HEIGHT + 50) return;

                const c = { ...particle.color, a: particle.color.a * particle.getAlpha() };

                if (particle.type === 'SOUL' || particle.type === 'STAR') {
                    this.renderer.drawGlow(screenPos, particle.size, c, particle.getAlpha());
                } else {
                    this.renderer.drawCircle(screenPos.x, screenPos.y, particle.size, c, true);
                }
            }

            renderUI() {
                const accentColor = Colors.getAccentColor(this.player.depth);

                // Health bar
                const hpBarWidth = 200;
                const hpBarHeight = 20;
                const hpBg = { x: 20, y: 20, w: hpBarWidth, h: hpBarHeight };
                const hpFg = { x: 20, y: 20, w: hpBarWidth * this.player.hp / this.player.maxHp, h: hpBarHeight };

                this.renderer.drawRect(hpBg, { r: 50, g: 50, b: 50, a: 200 }, true);
                this.renderer.drawRect(hpFg, { r: 200, g: 50, b: 50, a: 220 }, true);
                this.renderer.drawRect(hpBg, { r: 255, g: 255, b: 255, a: 255 }, false);

                this.renderer.drawText(`${this.player.hp} / ${this.player.maxHp}`, 
                    120, 38, { r: 255, g: 255, b: 255, a: 255 }, 16, 'center');

                // Souls
                this.renderer.drawCircle(Config.SCREEN_WIDTH - 140, 30, 10, 
                    { r: 255, g: 215, b: 0, a: 255 }, true);
                this.renderer.drawText(`x ${this.player.souls}`, 
                    Config.SCREEN_WIDTH - 120, 38, { r: 255, g: 215, b: 0, a: 255 }, 18, 'left');

                // Depth counter
                const depthBg = { 
                    x: Config.SCREEN_WIDTH / 2 - 100, 
                    y: 50, 
                    w: 200, 
                    h: 60 
                };
                this.renderer.drawRect(depthBg, { r: 0, g: 0, b: 0, a: 150 }, true);

                const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 500);
                this.renderer.drawGlow(
                    new Vec2(Config.SCREEN_WIDTH / 2, 80), 
                    50, 
                    accentColor, 
                    pulse * 0.5
                );

                this.renderer.drawText(`${Math.floor(this.player.depth)}m`, 
                    Config.SCREEN_WIDTH / 2, 90, accentColor, 32, 'center');
            }

            renderGameOver() {
                const overlay = { x: 0, y: 0, w: Config.SCREEN_WIDTH, h: Config.SCREEN_HEIGHT };
                this.renderer.drawRect(overlay, { r: 0, g: 0, b: 0, a: 200 }, true);

                const panel = {
                    x: Config.SCREEN_WIDTH / 2 - 200,
                    y: Config.SCREEN_HEIGHT / 2 - 200,
                    w: 400,
                    h: 400
                };

                const accentColor = Colors.getAccentColor(this.player.depth);
                this.renderer.drawRect(panel, { r: 20, g: 20, b: 30, a: 230 }, true);
                this.renderer.drawRect(panel, accentColor, false);

                this.renderer.drawText('GAME OVER', 
                    Config.SCREEN_WIDTH / 2, panel.y + 50, 
                    accentColor, 40, 'center');

                this.renderer.drawText(`Depth Reached: ${Math.floor(this.player.depth)}m`, 
                    Config.SCREEN_WIDTH / 2, panel.y + 120, 
                    { r: 255, g: 255, b: 255, a: 255 }, 24, 'center');

                this.renderer.drawText(`Enemies Slain: ${this.enemiesSlain}`, 
                    Config.SCREEN_WIDTH / 2, panel.y + 160, 
                    { r: 255, g: 255, b: 255, a: 255 }, 20, 'center');

                this.renderer.drawText(`Souls Collected: ${this.player.souls}`, 
                    Config.SCREEN_WIDTH / 2, panel.y + 190, 
                    { r: 255, g: 215, b: 0, a: 255 }, 20, 'center');

                this.renderer.drawText(`Time: ${Math.floor(this.timeSurvived)}s`, 
                    Config.SCREEN_WIDTH / 2, panel.y + 220, 
                    { r: 255, g: 255, b: 255, a: 255 }, 20, 'center');

                this.renderer.drawText('Press R to Restart', 
                    Config.SCREEN_WIDTH / 2, panel.y + 300, 
                    accentColor, 22, 'center');

                // Restart on R key
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'r' || e.key === 'R') {
                        this.state = 'PLAYING';
                        this.player = new Player(Config.SCREEN_WIDTH / 2, 100);
                        this.camera = new Camera();
                        this.enemiesSlain = 0;
                        this.timeSurvived = 0;
                        this.initLevel();
                    }
                });
            }

            run() {
                const gameLoop = (currentTime) => {
                    const deltaTime = Math.min((currentTime - this.lastTime) / 1000, 0.1);
                    this.lastTime = currentTime;

                    this.accumulator += deltaTime;

                    const fixedDt = 1 / Config.TARGET_FPS;
                    while (this.accumulator >= fixedDt) {
                        this.update(fixedDt);
                        this.accumulator -= fixedDt;
                    }

                    this.render();

                    requestAnimationFrame(gameLoop);
                };

                requestAnimationFrame(gameLoop);
            }
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            canvas.width = Config.SCREEN_WIDTH;
            canvas.height = Config.SCREEN_HEIGHT;

            // Adjust canvas for mobile
            const resizeCanvas = () => {
                const container = document.getElementById('gameContainer');
                const aspectRatio = Config.SCREEN_WIDTH / Config.SCREEN_HEIGHT;
                const windowRatio = window.innerWidth / window.innerHeight;

                if (windowRatio > aspectRatio) {
                    canvas.style.height = '100vh';
                    canvas.style.width = `${100 * aspectRatio / windowRatio}vh`;
                } else {
                    canvas.style.width = '100vw';
                    canvas.style.height = `${100 / aspectRatio * windowRatio}vw`;
                }
            };

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const game = new Game(canvas);
            game.run();
        });
    </script>
</body>
</html>
