<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: HD Descent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            user-select: none;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* HUD */
        .hud-panel {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            color: #d4af37; /* Gold */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .bar-wrap {
            width: 150px; height: 12px; background: #222; border: 1px solid #555;
            margin-bottom: 5px; position: relative;
        }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #8a0e0e, #ff4444); width: 100%; transition: width 0.2s; }
        .depth-display { font-size: 2rem; font-weight: bold; color: #fff; }
        .flask-indicator { font-size: 0.9rem; color: #aaa; margin-top: 5px; height: 20px;}

        /* Controls */
        .controls-area {
            height: 250px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
            pointer-events: auto;
        }

        /* Joystick Zone */
        .stick-zone {
            width: 50%; height: 100%;
            position: relative;
        }
        .stick-base {
            position: absolute; width: 70px; height: 70px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: none; pointer-events: none;
        }
        .stick-knob {
            position: absolute; width: 30px; height: 30px;
            background: rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            top: 20px; left: 20px;
            pointer-events: none;
        }

        /* Buttons */
        .btn-zone {
            width: 50%; height: 100%;
            display: flex; justify-content: flex-end; align-items: flex-end;
            gap: 20px; padding-bottom: 20px; padding-right: 20px;
        }
        
        .action-btn {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            color: #fff; font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s, background 0.1s;
        }
        .action-btn:active {
            transform: scale(0.95);
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
        }
        #btn-atk { width: 90px; height: 90px; border-color: #ff4444; color: #ff4444; margin-bottom: 40px; }
        #btn-jump { border-color: #44ff44; color: #44ff44; }

        /* Screens */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,10,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; color: #d4af37; text-align: center;
        }
        .hidden { display: none !important; }
        
        button.menu-btn {
            padding: 15px 40px; font-size: 1.2rem;
            background: transparent; border: 2px solid #d4af37; color: #d4af37;
            font-family: 'Cinzel'; margin-top: 20px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>
                <div style="font-size: 0.8rem; margin-bottom:2px;">VITALITY</div>
                <div class="bar-wrap"><div id="hp-bar" class="hp-fill"></div></div>
                <div id="buff-text" class="flask-indicator"></div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 0.8rem; color: #aaa;">DEPTH</div>
                <div id="score-disp" class="depth-display">0m</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="stick-zone" id="joystick">
                <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
            </div>
            <div class="btn-zone">
                <div class="action-btn" id="btn-atk">⚔</div>
                <div class="action-btn" id="btn-jump">⭱</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 2.5rem; text-shadow: 0 0 20px cyan;">ER TOSTIK</h1>
        <p style="color: #aaa;">THE ABYSS CALLS</p>
        <div style="margin: 20px; font-size: 0.9rem; color: #888;">
            <span style="color:#ff4444">RED</span> Heal &bull; 
            <span style="color:#4444ff">BLUE</span> Shield &bull; 
            <span style="color:#44ff44">GRN</span> Float &bull; 
            <span style="color:#ffaa00">ORG</span> Might
        </div>
        <button class="menu-btn" onclick="startGame()">Descend</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #ff4444;">FALLEN</h1>
        <p id="final-depth">0m</p>
        <button class="menu-btn" onclick="startGame()">Resurrect</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Config ---
        let W, H;
        const GRAVITY = 0.5;
        const FRICTION = 0.85;
        const WALL_WIDTH = 40;
        
        // --- State ---
        let gameActive = false;
        let camY = 0;
        let score = 0;
        let frame = 0;
        let shake = 0;
        let inputs = { x: 0, jump: false, atk: false };

        // --- Assets (Procedural) ---
        let player = {
            x: 0, y: 0, w: 20, h: 55, // Taller, human proportions
            vx: 0, vy: 0,
            hp: 100, maxHp: 100,
            facing: 1,
            grounded: false,
            animState: 'idle', // idle, run, jump, fall, attack
            animTimer: 0,
            // Combat
            invincible: 0,
            buff: null, buffTimer: 0,
            atkCooldown: 0
        };

        let platforms = [];
        let particles = [];
        let items = [];

        // --- Control System ---
        // Joystick
        const stickZone = document.getElementById('joystick');
        const stickBase = document.getElementById('stick-base');
        const stickKnob = document.getElementById('stick-knob');
        let touchId = null; 
        let startX, startY;

        stickZone.addEventListener('touchstart', e => {
            e.preventDefault();
            let t = e.changedTouches[0];
            touchId = t.identifier;
            startX = t.clientX; startY = t.clientY;
            
            let rect = stickZone.getBoundingClientRect();
            stickBase.style.display = 'block';
            stickBase.style.left = (startX - rect.left - 35) + 'px';
            stickBase.style.top = (startY - rect.top - 35) + 'px';
            stickKnob.style.transform = `translate(0px, 0px)`;
        });

        stickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === touchId) {
                    let t = e.changedTouches[i];
                    let dx = t.clientX - startX;
                    let dy = t.clientY - startY;
                    
                    let dist = Math.hypot(dx, dy);
                    let max = 35;
                    if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                    
                    stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputs.x = dx / max; // -1 to 1
                }
            }
        });

        const resetStick = () => {
            touchId = null; inputs.x = 0; stickBase.style.display = 'none';
        };
        stickZone.addEventListener('touchend', resetStick);

        // Buttons
        const bindBtn = (id, key) => {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); inputs[key] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); inputs[key] = false; });
        };
        bindBtn('btn-jump', 'jump');
        bindBtn('btn-atk', 'atk');

        // --- Core ---
        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
        }
        window.addEventListener('resize', resize);
        resize();

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            
            player.x = W/2; player.y = 100; player.vx = 0; player.vy = 0;
            player.hp = 100; player.buff = null;
            camY = 0; score = 0;
            
            platforms = []; items = []; particles = [];
            
            // Initial Ground
            platforms.push({x: W/2-100, y: 300, w: 200, h: 20, type:'stone'});
            genWorld(350, 2000);
            
            gameActive = true;
            loop();
        }

        function genWorld(sy, ey) {
            let y = sy;
            while(y < ey) {
                y += 80 + Math.random() * 80;
                let w = 80 + Math.random() * 120;
                let x = WALL_WIDTH + Math.random() * (W - WALL_WIDTH*2 - w);
                
                platforms.push({x, y, w, h: 20 + Math.random()*20, type:'stone'});

                // Item Spawn
                if(Math.random() < 0.1) {
                    let types = ['red', 'blue', 'green', 'orange'];
                    items.push({
                        x: x + w/2, y: y - 20,
                        type: types[Math.floor(Math.random()*types.length)]
                    });
                }
            }
        }

        function update() {
            if(!gameActive) return;
            frame++;
            
            // --- Physics ---
            player.vx = inputs.x * 5; // Speed
            player.vy += GRAVITY;

            // Feather Fall Buff
            if(player.buff === 'green' && player.vy > 2) player.vy = 2;

            player.x += player.vx;
            player.y += player.vy;
            player.vx *= FRICTION;

            // Direction & Anim State
            if(Math.abs(inputs.x) > 0.1) player.facing = Math.sign(inputs.x);
            
            if (!player.grounded) {
                player.animState = player.vy < 0 ? 'jump' : 'fall';
            } else if (Math.abs(inputs.x) > 0.1) {
                player.animState = 'run';
            } else {
                player.animState = 'idle';
            }
            player.animTimer++;

            // Jump
            if(inputs.jump && player.grounded) {
                player.vy = -12;
                player.grounded = false;
                spawnDust(player.x, player.y + player.h/2);
            }

            // Attack
            if(inputs.atk && player.atkCooldown <= 0) {
                player.atkCooldown = 20;
                player.animState = 'attack';
                // Hitbox logic here (simplified for visual demo)
                spawnSlash(player.x + (player.facing*30), player.y);
            }
            if(player.atkCooldown > 0) player.atkCooldown--;
            if(player.buffTimer > 0) player.buffTimer--;
            else player.buff = null;
            if(player.invincible > 0) player.invincible--;

            // --- Collisions ---
            // Walls (Borders)
            if(player.x < WALL_WIDTH + 10) { player.x = WALL_WIDTH + 10; player.vx = 0; }
            if(player.x > W - WALL_WIDTH - 10) { player.x = W - WALL_WIDTH - 10; player.vx = 0; }

            // Platforms
            player.grounded = false;
            if(player.vy > 0) {
                platforms.forEach(p => {
                    if(player.x > p.x && player.x < p.x + p.w &&
                       player.y + player.h/2 >= p.y &&
                       player.y + player.h/2 <= p.y + p.h + player.vy) {
                        player.grounded = true;
                        player.vy = 0;
                        player.y = p.y - player.h/2;
                    }
                });
            }

            // Items
            items.forEach((it, i) => {
                let dist = Math.hypot(player.x - it.x, player.y - it.y);
                if(dist < 30) {
                    // Pickup
                    items.splice(i, 1);
                    applyBuff(it.type);
                }
            });

            // Camera & Gen
            let targetY = player.y - H * 0.4;
            if(targetY > camY) camY = targetY;
            if(player.y > score) score = player.y;

            if(platforms[platforms.length-1].y < camY + H * 1.5) {
                genWorld(platforms[platforms.length-1].y, platforms[platforms.length-1].y + 1000);
            }
            
            // Cleanup
            if(platforms[0].y < camY - 100) platforms.shift();
            items = items.filter(i => i.y > camY - 100);

            // UI
            document.getElementById('hp-bar').style.width = player.hp + '%';
            document.getElementById('score-disp').innerText = Math.floor(score/10) + 'm';
            let bText = "";
            if(player.buff) bText = `${player.buff.toUpperCase()} (${Math.ceil(player.buffTimer/60)}s)`;
            document.getElementById('buff-text').innerText = bText;
            document.getElementById('buff-text').style.color = getBuffColor(player.buff);
        }

        function applyBuff(type) {
            if(type === 'red') player.hp = Math.min(100, player.hp + 30);
            else {
                player.buff = type;
                player.buffTimer = 600; // 10s
            }
        }

        function getBuffColor(t) {
            if(t==='red') return '#ff4444';
            if(t==='blue') return '#4444ff';
            if(t==='green') return '#44ff44';
            if(t==='orange') return '#ffaa00';
            return '#fff';
        }

        function spawnDust(x, y) {
            for(let i=0;i<5;i++) particles.push({x, y, vx:(Math.random()-0.5)*2, vy:Math.random()*-2, life:30, c:'#aaa'});
        }
        function spawnSlash(x, y) {
            particles.push({x, y, type:'slash', life:10, facing:player.facing});
        }

        // --- Visuals ---
        function drawBackground() {
            // Gradual change based on depth
            let depthFactor = Math.min(1, score / 10000);
            
            let r1=20, g1=20, b1=50; // Top (Blueish)
            let r2=40, g2=0,  b2=10; // Bottom (Reddish)
            
            let r = r1 + (r2-r1)*depthFactor;
            let g = g1 + (g2-g1)*depthFactor;
            let b = b1 + (b2-b1)*depthFactor;

            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, `rgb(${r*0.5}, ${g*0.5}, ${b*0.5})`);
            grad.addColorStop(1, `rgb(${r}, ${g}, ${b})`);
            
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,H);
        }

        function drawWalls() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, WALL_WIDTH, H);
            ctx.fillRect(W-WALL_WIDTH, 0, WALL_WIDTH, H);
            
            // Texture
            ctx.strokeStyle = "#333";
            ctx.beginPath();
            let shift = (camY % 100);
            for(let y = -shift; y < H; y+=50) {
                // Left cracks
                ctx.moveTo(5, y); ctx.lineTo(30, y+20); ctx.lineTo(10, y+40);
                // Right cracks
                ctx.moveTo(W-5, y); ctx.lineTo(W-30, y+20); ctx.lineTo(W-10, y+40);
            }
            ctx.stroke();
        }

        function drawHuman(x, y, w, h, facing, state, timer) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(facing, 1); // Flip horizontally if facing left
            
            // Skeleton Points
            let headY = -h/2;
            let neckY = -h/2 + 10;
            let hipY = 0;
            let kneeY = 15;
            let footY = 28;

            // Animation Offsets
            let armAngle = 0;
            let legAngle = 0;
            let bob = 0;

            if (state === 'idle') {
                bob = Math.sin(timer * 0.1) * 1;
                armAngle = Math.sin(timer * 0.05) * 0.1;
            } else if (state === 'run') {
                legAngle = Math.sin(timer * 0.3) * 0.8;
                armAngle = -legAngle;
                bob = Math.abs(Math.sin(timer * 0.6)) * 2;
            } else if (state === 'jump') {
                legAngle = 0.5;
                armAngle = -2; // Arms up
            } else if (state === 'fall') {
                legAngle = 0.2;
                armAngle = -2.5; // Arms flailing up
            } else if (state === 'attack') {
                armAngle = -Math.PI/2 + (Math.sin(timer)*2); // Slash
            }

            // --- Draw Body Parts (Realistic Style) ---
            ctx.strokeStyle = "#fff";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            
            // 1. Back Leg
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#555"; // Darker for depth
            ctx.beginPath();
            ctx.moveTo(0, hipY + bob);
            ctx.lineTo(-Math.sin(legAngle)*10, kneeY + bob);
            ctx.lineTo(-Math.sin(legAngle)*15, footY + bob);
            ctx.stroke();

            // 2. Back Arm
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(0, neckY + 5 + bob);
            ctx.lineTo(Math.sin(armAngle)*10, neckY + 15 + bob);
            ctx.lineTo(Math.sin(armAngle)*15, neckY + 25 + bob);
            ctx.stroke();

            // 3. Torso
            ctx.fillStyle = "#1e2840"; // Armor Color
            ctx.beginPath();
            // Trapezoid body
            ctx.moveTo(-6, neckY + bob);
            ctx.lineTo(6, neckY + bob);
            ctx.lineTo(4, hipY + bob);
            ctx.lineTo(-4, hipY + bob);
            ctx.fill();
            // Gold Trim
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(-2, neckY + bob, 4, 15);

            // 4. Head
            ctx.fillStyle = "#ffccaa"; // Skin
            ctx.beginPath(); ctx.arc(0, headY + bob, 7, 0, Math.PI*2); ctx.fill();
            // Helmet
            ctx.fillStyle = "#444";
            ctx.beginPath(); ctx.arc(0, headY + bob - 2, 7, Math.PI, 0); ctx.fill();

            // 5. Front Leg
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#fff"; // Bright leg
            ctx.beginPath();
            ctx.moveTo(0, hipY + bob);
            ctx.lineTo(Math.sin(legAngle)*10, kneeY + bob);
            ctx.lineTo(Math.sin(legAngle)*15, footY + bob);
            ctx.stroke();

            // 6. Front Arm (Holding Sword)
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#fff";
            ctx.beginPath();
            let handX = -Math.sin(armAngle)*15;
            let handY = neckY + 25 + bob;
            ctx.moveTo(0, neckY + 5 + bob);
            ctx.lineTo(-Math.sin(armAngle)*10, neckY + 15 + bob);
            ctx.lineTo(handX, handY);
            ctx.stroke();

            // Sword
            ctx.save();
            ctx.translate(handX, handY);
            ctx.rotate(-armAngle + 1.5); // Angle sword
            ctx.fillStyle = "#d4af37"; // Hilt
            ctx.fillRect(-2, -2, 4, 8);
            ctx.fillStyle = (player.buff === 'orange') ? "#ffaa00" : "#00ffff"; // Blade (glowing)
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(-1, -25, 2, 25);
            ctx.restore();

            // Shield Buff Visual
            if (player.buff === 'blue') {
                ctx.strokeStyle = "#4444ff"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.stroke();
            }

            ctx.restore();
        }

        function draw() {
            // BG
            drawBackground();
            
            ctx.save();
            ctx.translate(0, -camY);

            drawWalls();

            // Platforms
            platforms.forEach(p => {
                // Stone texture
                ctx.fillStyle = "#222";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Top Grass/Moss
                ctx.fillStyle = "#345";
                ctx.fillRect(p.x, p.y, p.w, 4);
                // Cracks
                ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p.x + 10, p.y); ctx.lineTo(p.x + 15, p.y+10);
                ctx.stroke();
            });

            // Items
            items.forEach(it => {
                let y = it.y + Math.sin(frame*0.1)*3;
                let c = getBuffColor(it.type);
                ctx.fillStyle = c;
                ctx.shadowBlur = 10; ctx.shadowColor = c;
                
                // Draw Flask Shape
                ctx.beginPath();
                ctx.arc(it.x, y+5, 6, 0, Math.PI*2); // Bulb
                ctx.rect(it.x-2, y-4, 4, 6); // Neck
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.type === 'slash') {
                    ctx.strokeStyle = "#fff"; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI*2); ctx.stroke();
                } else {
                    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3);
                }
                if(p.life<=0) particles.splice(i,1);
            });

            // Player
            // Blink if hurt
            if (player.invincible <= 0 || frame % 4 === 0) {
                drawHuman(player.x, player.y, player.w, player.h, player.facing, player.animState, player.animTimer);
            }
            
            // Lantern Effect (Vignette)
            ctx.restore(); // Stop camera translation for UI/Vignette overlay
            
            // Create a "hole" in the darkness around player
            // Need player screen coords
            let px = player.x;
            let py = player.y - camY;

            let rad = ctx.createRadialGradient(px, py, 60, px, py, 400);
            rad.addColorStop(0, "rgba(0,0,0,0)");
            rad.addColorStop(1, "rgba(0,0,0,0.85)");
            
            ctx.fillStyle = rad;
            ctx.fillRect(0,0,W,H);
        }

        function loop() {
            if(gameActive) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
