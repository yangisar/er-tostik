<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: Warrior's Descent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Cinzel', serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top HUD */
        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            color: #d4af37;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #000;
        }

        /* Bottom Controls Container */
        .controls-area {
            height: 180px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto; /* Enable touch here */
            padding-bottom: 40px;
        }

        /* Buttons */
        .btn-circle {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .btn-circle:active {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(0.95);
        }

        /* Left Side (Movement) */
        .d-pad {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .btn-move {
            width: 70px;
            height: 70px;
            font-size: 2rem;
        }

        /* Right Side (Combat) */
        .action-pad {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .btn-atk {
            width: 90px;
            height: 90px;
            font-size: 2.5rem;
            border-color: #ff4444;
            color: #ff4444;
        }
        .btn-jump {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        /* Game Over / Start */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        h1 { margin: 0 0 10px 0; font-size: 2rem; }
        p { color: #aaa; max-width: 80%; text-align: center; margin-bottom: 30px; }
        
        .main-btn {
            padding: 15px 40px;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score">Depth: 0m</div>
            <div id="health">HP: 100</div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn-circle btn-move" id="btn-left">◄</div>
                <div class="btn-circle btn-move" id="btn-right">►</div>
            </div>
            <div class="action-pad">
                <div class="btn-circle btn-jump" id="btn-jump">⭱</div>
                <div class="btn-circle btn-atk" id="btn-atk">⚔</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen-overlay">
        <h1>ER TOSTIK</h1>
        <p>The Underworld Awaits.</p>
        <p>Use arrows to Move.<br>Sword to slay Shadows.<br>Descend to find the lost.</p>
        <button class="main-btn" onclick="initGame()">Enter</button>
    </div>

    <div id="game-over-screen" class="screen-overlay hidden">
        <h1 style="color:#ff4444">DEFEATED</h1>
        <p id="final-score">Depth: 0m</p>
        <button class="main-btn" onclick="initGame()">Revive</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Game Config ---
        let width, height;
        const GRAVITY = 0.6;
        const FRICTION = 0.8;
        const MOVE_SPEED = 5;
        const JUMP_FORCE = -12;
        
        // --- State ---
        let gameRunning = false;
        let cameraY = 0;
        let score = 0;
        let inputs = { left: false, right: false, jump: false, attack: false };
        let particles = [];
        
        // --- Entities ---
        let player = {
            x: 0, y: 0, w: 20, h: 40,
            vx: 0, vy: 0,
            hp: 100,
            facing: 1, // 1 right, -1 left
            attackCooldown: 0,
            isAttacking: false,
            grounded: false,
            invincible: 0
        };

        let platforms = [];
        let enemies = [];

        // --- Input Handling (Touch & Mouse) ---
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); inputs[key] = true; };
            const end = (e) => { e.preventDefault(); inputs[key] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mouseleave', end);
        };

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        
        // Jump trigger
        const jumpBtn = document.getElementById('btn-jump');
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(player.grounded) player.vy = JUMP_FORCE; });
        jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if(player.grounded) player.vy = JUMP_FORCE; });

        // Attack trigger
        const atkBtn = document.getElementById('btn-atk');
        const doAttack = (e) => {
            e.preventDefault();
            if(player.attackCooldown <= 0) {
                player.isAttacking = true;
                player.attackCooldown = 20;
                checkCombat();
            }
        };
        atkBtn.addEventListener('touchstart', doAttack);
        atkBtn.addEventListener('mousedown', doAttack);

        // Keyboard support for desktop testing
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') inputs.left = true;
            if(e.key === 'ArrowRight') inputs.right = true;
            if(e.key === ' ' && player.grounded) player.vy = JUMP_FORCE;
            if(e.key === 'z') doAttack(e);
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') inputs.left = false;
            if(e.key === 'ArrowRight') inputs.right = false;
        });

        // --- Core Functions ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            player.x = width / 2;
            player.y = 100;
            player.vx = 0; 
            player.vy = 0;
            player.hp = 100;
            cameraY = 0;
            score = 0;
            
            platforms = [];
            enemies = [];
            particles = [];
            
            // Initial Platform
            platforms.push({x: width/2 - 100, y: 200, w: 200, h: 20});
            
            // Generate world ahead
            generateWorld(200, 2000);
            
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function generateWorld(startY, endY) {
            let y = startY;
            while(y < endY) {
                y += 100 + Math.random() * 100; // Gap between platforms
                let w = 100 + Math.random() * 150;
                let x = Math.random() * (width - w);
                
                platforms.push({x, y, w, h: 20});

                // Add Enemy Chance (30%)
                if (Math.random() < 0.3) {
                    enemies.push({
                        x: x + w/2,
                        y: y - 30,
                        w: 30, h: 30,
                        patrolStart: x,
                        patrolEnd: x + w,
                        vx: 1 + Math.random(),
                        hp: 1
                    });
                }
            }
        }

        function checkCombat() {
            // Create Hitbox in front of player
            let hitX = player.x + (player.facing * 30);
            let hitY = player.y;
            let range = 50;

            // Visual Slash
            for(let i=0; i<5; i++) createParticle(hitX, hitY, '#fff', 5);

            enemies.forEach((en, i) => {
                let dx = en.x - player.x;
                let dy = en.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                // If enemy is in front and close
                if (dist < range && Math.sign(dx) === player.facing) {
                    en.hp--;
                    // Blood effect
                    for(let k=0; k<10; k++) createParticle(en.x, en.y, '#ff0000', 3);
                }
            });
        }

        function createParticle(x, y, col, speed) {
            particles.push({
                x, y, col,
                vx: (Math.random() - 0.5) * speed,
                vy: (Math.random() - 0.5) * speed,
                life: 1.0
            });
        }

        function update() {
            if (!gameRunning) return;

            // --- Player Physics ---
            if (inputs.left) { player.vx -= 0.5; player.facing = -1; }
            if (inputs.right) { player.vx += 0.5; player.facing = 1; }
            
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            
            // Max speed cap
            if(player.vx > MOVE_SPEED) player.vx = MOVE_SPEED;
            if(player.vx < -MOVE_SPEED) player.vx = -MOVE_SPEED;

            player.x += player.vx;
            player.y += player.vy;

            // Cooldowns
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.isAttacking && player.attackCooldown < 15) player.isAttacking = false;
            if (player.invincible > 0) player.invincible--;

            // --- Collisions ---
            player.grounded = false;
            
            // Platform Collision
            platforms.forEach(p => {
                // Check if falling onto platform
                if (player.vy > 0 && 
                    player.y + player.h/2 >= p.y && 
                    player.y + player.h/2 <= p.y + p.h + player.vy && // +player.vy prevents tunneling
                    player.x >= p.x && 
                    player.x <= p.x + p.w) {
                        
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.h/2;
                }
            });

            // Enemy Logic
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                
                // Dead?
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Patrol
                en.x += en.vx;
                if (en.x > en.patrolEnd || en.x < en.patrolStart) en.vx *= -1;

                // Collision with Player
                let dx = player.x - en.x;
                let dy = player.y - en.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 30 && player.invincible <= 0) {
                    player.hp -= 20;
                    player.invincible = 60; // 1 second i-frame
                    player.vy = -5; // Knockback
                    player.vx = -Math.sign(dx) * 5;
                    createParticle(player.x, player.y, '#d4af37', 5);
                }
            }

            // Death Check
            if (player.hp <= 0) {
                gameRunning = false;
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `Depth: ${Math.floor(score)}m`;
            }

            // --- Camera & World Gen ---
            // Camera follows player vertically, but never goes UP (only descent)
            // Center the player on screen vertically
            let targetCamY = player.y - height * 0.4;
            if (targetCamY > cameraY) {
                cameraY = targetCamY; // Camera only moves down
            }

            // Score tracks deepest point
            if (player.y > score) score = player.y;

            // Generate more world as we fall
            let deepestPlatform = platforms[platforms.length-1].y;
            if (deepestPlatform < cameraY + height * 2) {
                generateWorld(deepestPlatform, deepestPlatform + 1000);
            }

            // Cleanup old objects
            if (platforms[0].y < cameraY - 100) platforms.shift();
            enemies = enemies.filter(e => e.y > cameraY - 100);

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            });

            // UI Update
            document.getElementById('score').innerText = `Depth: ${Math.floor(score/10)}m`;
            document.getElementById('health').innerText = `HP: ${player.hp}`;
        }

        function drawHuman(ctx, x, y, facing, isAttacking) {
            ctx.save();
            ctx.translate(x, y);
            
            // Color logic (blink red if hurt)
            ctx.fillStyle = player.invincible > 0 && Math.floor(Date.now()/50)%2==0 ? "red" : "#000";
            ctx.strokeStyle = ctx.fillStyle;
            
            // Head
            ctx.beginPath();
            ctx.arc(0, -15, 6, 0, Math.PI*2);
            ctx.fill();

            // Body
            ctx.fillRect(-4, -10, 8, 20);

            // Legs (simple animation)
            if (Math.abs(player.vx) > 0.1 && player.grounded) {
                let legOffset = Math.sin(Date.now() / 50) * 5;
                ctx.beginPath();
                ctx.moveTo(-2, 10); ctx.lineTo(-5 + legOffset, 20);
                ctx.moveTo(2, 10); ctx.lineTo(5 - legOffset, 20);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(-2, 10); ctx.lineTo(-2, 20);
                ctx.moveTo(2, 10); ctx.lineTo(2, 20);
                ctx.stroke();
            }

            // Sword Arm
            ctx.save();
            ctx.translate(0, -5); // Shoulder
            if (isAttacking) {
                ctx.rotate(facing * Math.PI / 2); // Swing down
            } else {
                ctx.rotate(facing * -Math.PI / 4); // Idle hold
            }
            
            // Arm
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(10 * facing, 0);
            ctx.stroke();

            // Sword
            ctx.strokeStyle = "#d4af37"; // Gold sword
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10 * facing, 0);
            ctx.lineTo(35 * facing, 0);
            ctx.stroke();
            ctx.restore();

            ctx.restore();
        }

        function drawEnemy(ctx, e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            
            // Smoky effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#800080";
            ctx.fillStyle = "#200020";
            
            // Shape
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI*2);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = "#ff0000";
            ctx.shadowBlur = 5;
            ctx.shadowColor = "#ff0000";
            let lookDir = Math.sign(e.vx);
            ctx.fillRect(lookDir*5, -5, 4, 4);

            ctx.restore();
        }

        function draw() {
            // Background Clear
            ctx.fillStyle = "#050510";
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            // Apply Camera
            ctx.translate(0, -cameraY);

            // Draw Platforms
            ctx.fillStyle = "#1a1a2e";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Gold trim
                ctx.fillStyle = "#333";
                ctx.fillRect(p.x, p.y, p.w, 3);
                ctx.fillStyle = "#1a1a2e";
            });

            // Draw Enemies
            enemies.forEach(e => drawEnemy(ctx, e));

            // Draw Player
            drawHuman(ctx, player.x, player.y, player.facing, player.isAttacking);

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.col;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function gameLoop() {
            if(!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
