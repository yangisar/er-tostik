<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: Definitive Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            touch-action: none;
            user-select: none;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* HUD */
        .hud-panel {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            color: #d4af37;
            text-shadow: 0 2px 4px #000;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .bar-wrap {
            width: 160px; height: 14px; background: #111; border: 1px solid #444;
            margin-bottom: 5px; position: relative; overflow: hidden;
        }
        .hp-fill { 
            height: 100%; background: linear-gradient(90deg, #8a0e0e, #ff3333); 
            width: 100%; transition: width 0.2s; 
        }

        .flask-slot {
            display: flex; gap: 8px; margin-top: 5px; align-items: center;
            font-size: 0.8rem; color: #ccc;
        }
        .flask-icon {
            width: 18px; height: 18px; border-radius: 50%;
            background: #222; border: 1px solid #555;
            box-shadow: 0 0 5px #000;
        }

        /* Controls */
        .controls-area {
            height: 250px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
            pointer-events: auto;
            padding-bottom: 40px;
        }

        /* Joystick */
        .stick-zone { width: 45%; height: 100%; position: relative; }
        .stick-base {
            position: absolute; width: 80px; height: 80px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            border-radius: 50%; display: none; pointer-events: none;
        }
        .stick-knob {
            position: absolute; width: 40px; height: 40px;
            background: rgba(212, 175, 55, 0.8);
            border-radius: 50%; top: 20px; left: 20px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Buttons */
        .btn-zone {
            width: 50%; height: 100%;
            display: flex; justify-content: flex-end; align-items: flex-end;
            gap: 25px;
        }
        .action-btn {
            width: 85px; height: 85px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            color: #fff; font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        
        #btn-atk { border-color: #ff4444; color: #ff4444; margin-bottom: 30px; }
        #btn-jump { border-color: #44ff44; color: #44ff44; }

        /* Screens */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,8,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; color: #d4af37; text-align: center;
        }
        .hidden { display: none !important; }
        
        .menu-btn {
            margin-top: 30px; padding: 15px 50px;
            font-size: 1.2rem; font-family: 'Cinzel';
            background: transparent; color: #d4af37;
            border: 2px solid #d4af37; cursor: pointer;
            text-transform: uppercase;
        }
        
        .toast {
            position: absolute; top: 25%; width: 100%; text-align: center;
            font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px #f00;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>
                <div style="font-size: 0.7rem; color:#aaa; margin-bottom:4px;">VITALITY</div>
                <div class="bar-wrap"><div id="hp-bar" class="hp-fill"></div></div>
                <div class="flask-slot">
                    <div id="buff-icon" class="flask-icon"></div>
                    <span id="buff-text">NO BUFFS</span>
                </div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 0.7rem; color: #aaa;">DEPTH</div>
                <div id="score-disp" style="font-size: 2.2rem; font-weight:bold; color:#fff;">0m</div>
            </div>
        </div>
        
        <div id="toast-msg" class="toast">IMPACT!</div>

        <div class="controls-area">
            <div class="stick-zone" id="joystick">
                <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
            </div>
            <div class="btn-zone">
                <div class="action-btn" id="btn-atk">⚔</div>
                <div class="action-btn" id="btn-jump">⭱</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 0; text-shadow: 0 0 20px cyan;">ER TOSTIK</h1>
        <p style="color: #888; letter-spacing: 3px; margin-top:5px;">DEFINITIVE EDITION</p>
        <button class="menu-btn" onclick="startGame()">Descend</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #ff4444; font-size: 3rem;">FALLEN</h1>
        <p id="final-depth" style="font-size: 2rem; color: #fff; margin: 10px 0;">0m</p>
        <button class="menu-btn" onclick="startGame()">Rise</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // --- Config ---
        let W, H;
        const GRAVITY = 0.5;
        const FRICTION = 0.85;
        const WALL_WIDTH = 40;
        const FALL_DMG_THRESHOLD = 450;
        
        // --- State ---
        let gameActive = false;
        let camY = 0;
        let score = 0;
        let frame = 0;
        let shake = 0;
        let inputs = { x: 0, jump: false, atk: false };

        // --- Objects ---
        let player = {
            x: 0, y: 0, w: 20, h: 55, // HD Proportions
            vx: 0, vy: 0,
            hp: 100, maxHp: 100,
            facing: 1,
            grounded: false,
            fallStartY: 0,
            animState: 'idle',
            animTimer: 0,
            invincible: 0,
            buff: null, buffTimer: 0,
            atkCooldown: 0
        };

        let platforms = [];
        let particles = [];
        let enemies = [];
        let items = [];
        let projectiles = [];
        let bgStars = [];

        // --- Input ---
        const stickZone = document.getElementById('joystick');
        const stickBase = document.getElementById('stick-base');
        const stickKnob = document.getElementById('stick-knob');
        let touchId = null; 
        let startX, startY;

        stickZone.addEventListener('touchstart', e => {
            e.preventDefault();
            let t = e.changedTouches[0];
            touchId = t.identifier;
            startX = t.clientX; startY = t.clientY;
            
            let rect = stickZone.getBoundingClientRect();
            stickBase.style.display = 'block';
            stickBase.style.left = (startX - rect.left - 40) + 'px';
            stickBase.style.top = (startY - rect.top - 40) + 'px';
            stickKnob.style.transform = `translate(0px, 0px)`;
        }, {passive: false});

        stickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === touchId) {
                    let t = e.changedTouches[i];
                    let dx = t.clientX - startX;
                    let dy = t.clientY - startY;
                    let dist = Math.hypot(dx, dy);
                    let max = 40;
                    if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                    stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputs.x = dx / max; 
                }
            }
        }, {passive: false});

        const resetStick = () => { touchId = null; inputs.x = 0; stickBase.style.display = 'none'; };
        stickZone.addEventListener('touchend', resetStick);
        stickZone.addEventListener('touchcancel', resetStick);

        const bindBtn = (id, key) => {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); inputs[key] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); inputs[key] = false; });
        };
        bindBtn('btn-jump', 'jump');
        bindBtn('btn-atk', 'atk');

        // --- Core ---
        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            bgStars = [];
            for(let i=0; i<60; i++) bgStars.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2});
        }
        window.addEventListener('resize', resize);
        resize();

        function showToast(msg, color="#fff") {
            const t = document.getElementById('toast-msg');
            t.innerText = msg;
            t.style.color = color;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 1500);
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            
            player.x = W/2; player.y = 100; player.vx = 0; player.vy = 0;
            player.hp = 100; player.buff = null;
            player.fallStartY = player.y;
            camY = 0; score = 0;
            
            platforms = []; items = []; particles = []; enemies = []; projectiles = [];
            platforms.push({x: W/2-100, y: 300, w: 200, h: 20, type:'stone'});
            genWorld(350, 2000);
            
            gameActive = true;
            loop();
        }

        function genWorld(sy, ey) {
            let y = sy;
            while(y < ey) {
                y += 90 + Math.random() * 80;
                let w = 80 + Math.random() * 120;
                let x = WALL_WIDTH + Math.random() * (W - WALL_WIDTH*2 - w);
                
                platforms.push({x, y, w, h: 25, type:'stone'});

                if (Math.random() < 0.4 && y > 500) {
                    let type = 'crawler';
                    if (y > 1000 && Math.random() > 0.6) type = 'bat';
                    if (y > 2000 && Math.random() > 0.8) type = 'sentinel';

                    enemies.push({
                        type: type,
                        x: x + w/2, y: y - 20,
                        w: 30, h: 30,
                        vx: type === 'sentinel' ? 0 : 1,
                        hp: type === 'sentinel' ? 40 : 20,
                        patrol: [x, x+w],
                        timer: 0,
                        startY: y - 20 
                    });
                }
                
                if(Math.random() < 0.1) {
                    let types = ['red', 'blue', 'green', 'orange'];
                    items.push({ x: x + w/2, y: y - 30, type: types[Math.floor(Math.random()*types.length)] });
                }
            }
        }

        function update() {
            if(!gameActive) return;
            frame++;
            
            // Movement
            player.vx = inputs.x * 5.5;
            player.vy += GRAVITY;
            if(player.buff === 'green' && player.vy > 2) player.vy = 2;

            if (player.vy < 0) player.fallStartY = player.y;

            player.x += player.vx;
            player.y += player.vy;
            player.vx *= FRICTION;

            // Anim State
            if(Math.abs(inputs.x) > 0.1) player.facing = Math.sign(inputs.x);
            
            if (!player.grounded) {
                player.animState = player.vy < 0 ? 'jump' : 'fall';
            } else if (Math.abs(inputs.x) > 0.1) {
                player.animState = 'run';
            } else {
                player.animState = 'idle';
            }
            player.animTimer++;

            // Jump
            if(inputs.jump && player.grounded) {
                player.vy = -12.5;
                player.grounded = false;
                player.fallStartY = player.y;
                spawnParticles(player.x, player.y + player.h/2, '#888', 5);
            }

            // Attack
            if(inputs.atk && player.atkCooldown <= 0) {
                player.atkCooldown = 20;
                player.animState = 'attack';
                spawnSlashVisual(player.x, player.y, player.facing);
                
                let hitRect = { x: player.x + (player.facing*30) - 20, y: player.y-30, w: 60, h: 60 };
                enemies.forEach(e => {
                    if (rectIntersect(hitRect, {x:e.x-15, y:e.y-15, w:30, h:30})) {
                        let dmg = player.buff === 'orange' ? 40 : 20;
                        e.hp -= dmg;
                        spawnParticles(e.x, e.y, '#f00', 8);
                        shake = 6;
                    }
                });
            }
            if(player.atkCooldown > 0) player.atkCooldown--;
            if(player.invincible > 0) player.invincible--;
            if(player.buffTimer > 0) player.buffTimer--; else player.buff = null;

            // Walls
            if(player.x < WALL_WIDTH + 10) { 
                player.x = WALL_WIDTH + 10; player.vx = 0; 
                if(player.vy > 0) { player.vy*=0.8; player.fallStartY = player.y; }
            }
            if(player.x > W - WALL_WIDTH - 10) { 
                player.x = W - WALL_WIDTH - 10; player.vx = 0; 
                if(player.vy > 0) { player.vy*=0.8; player.fallStartY = player.y; }
            }

            // Platforms & Collision
            let wasGrounded = player.grounded;
            player.grounded = false;
            
            if(player.vy > 0) {
                platforms.forEach(p => {
                    if(player.x > p.x && player.x < p.x + p.w &&
                       player.y + player.h/2 >= p.y &&
                       player.y + player.h/2 <= p.y + p.h + player.vy) {
                        
                        if (!wasGrounded) {
                            let fallDist = player.y - player.fallStartY;
                            if (fallDist > FALL_DMG_THRESHOLD && player.buff !== 'green') {
                                let dmg = Math.floor((fallDist - FALL_DMG_THRESHOLD) / 10);
                                player.hp -= dmg;
                                shake = 15;
                                spawnParticles(player.x, p.y, '#fff', 15);
                                showToast(`FALL DMG -${dmg}`, "#f44");
                            }
                            player.fallStartY = player.y;
                        }

                        player.grounded = true;
                        player.vy = 0;
                        player.y = p.y - player.h/2;
                    }
                });
            } else {
                player.fallStartY = player.y;
            }

            // Enemies
            enemies.forEach((e, i) => {
                if(e.hp <= 0) { enemies.splice(i, 1); return; }

                if (e.type === 'crawler') {
                    e.x += e.vx;
                    if(e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;
                } else if (e.type === 'bat') {
                    e.x += Math.sin(frame * 0.05) * 2;
                    e.y += (player.y - e.y) * 0.02;
                    if (Math.abs(player.x - e.x) < 200) e.x += (player.x - e.x) * 0.01;
                } else if (e.type === 'sentinel') {
                    e.timer++;
                    if (e.timer > 120) {
                        let angle = Math.atan2(player.y - e.y, player.x - e.x);
                        projectiles.push({x: e.x, y: e.y, vx: Math.cos(angle)*5, vy: Math.sin(angle)*5, life: 100});
                        e.timer = 0;
                    }
                }

                if (player.invincible <= 0 && rectIntersect({x:player.x-10,y:player.y-25,w:20,h:50}, {x:e.x-10,y:e.y-10,w:20,h:20})) {
                    if (player.buff === 'blue') {
                        player.buff = null; player.invincible = 30; e.vx *= -3;
                    } else {
                        player.hp -= 15; shake = 10; player.invincible = 60;
                        player.vy = -6; player.vx = -player.facing * 8;
                    }
                }
            });

            // Projectiles
            projectiles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) projectiles.splice(i, 1);
                else if (player.invincible <= 0 && rectIntersect({x:player.x-10,y:player.y-25,w:20,h:50}, {x:p.x-5,y:p.y-5,w:10,h:10})) {
                    player.hp -= 10; player.invincible = 30; projectiles.splice(i, 1);
                }
            });

            // Items
            items.forEach((it, i) => {
                if(Math.hypot(player.x - it.x, player.y - it.y) < 30) {
                    items.splice(i, 1); applyBuff(it.type);
                }
            });

            if(player.hp <= 0) { gameActive = false; document.getElementById('game-over').classList.remove('hidden'); document.getElementById('final-depth').innerText = Math.floor(score/10) + "m"; }
            
            let targetY = player.y - H * 0.4;
            if(targetY > camY) camY = targetY;
            if(player.y > score) score = player.y;

            if(platforms[platforms.length-1].y < camY + H * 1.5) genWorld(platforms[platforms.length-1].y, platforms[platforms.length-1].y + 1000);
            if(platforms[0].y < camY - 200) platforms.shift();
            items = items.filter(i => i.y > camY - 200);
            enemies = enemies.filter(e => e.y > camY - 200);

            updateUI();
            if(shake > 0) shake *= 0.9;
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function applyBuff(type) {
            if(type === 'red') { player.hp = Math.min(100, player.hp + 30); showToast("HEALED", "#f44"); }
            else { player.buff = type; player.buffTimer = 900; showToast(type.toUpperCase(), "#fff"); }
        }

        function updateUI() {
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
            document.getElementById('score-disp').innerText = Math.floor(score/10) + 'm';
            const bTxt = document.getElementById('buff-text');
            const bIcon = document.getElementById('buff-icon');
            if (player.buff) {
                bTxt.innerText = `${player.buff.toUpperCase()} (${Math.ceil(player.buffTimer/60)}s)`;
                bIcon.style.backgroundColor = getBuffColor(player.buff);
            } else { bTxt.innerText = "NO BUFFS"; bIcon.style.backgroundColor = "#222"; }
        }

        function spawnParticles(x, y, c, n) {
            for(let i=0;i<n;i++) particles.push({x, y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:30, c});
        }
        function spawnSlashVisual(x, y, facing) {
            particles.push({x, y, type:'slash', life:12, facing, timer:0});
        }
        function getBuffColor(t) { if(t==='red') return '#f44'; if(t==='blue') return '#44f'; if(t==='green') return '#4f4'; return '#fa0'; }

        // --- Render (HD Style) ---
        function draw() {
            // Background Gradient
            let depthFactor = Math.min(1, score / 15000);
            let r = 20 + (30*depthFactor);
            let g = 20; 
            let b = 50 - (20*depthFactor);
            
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, `rgb(${r*0.5},${g*0.5},${b*0.5})`);
            grad.addColorStop(1, `rgb(${r},${g},${b})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,H);

            // Stars
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            bgStars.forEach(s => {
                let sy = (s.y - camY * 0.5) % H; if(sy<0) sy+=H;
                ctx.fillRect(s.x, sy, s.s, s.s);
            });

            // Camera Shake
            let sx = (Math.random()-0.5)*shake;
            let sy = (Math.random()-0.5)*shake;
            ctx.save();
            ctx.translate(sx, sy - camY);

            // Walls (Textured)
            ctx.fillStyle = "#111";
            ctx.fillRect(0, camY-100, WALL_WIDTH, H+200);
            ctx.fillRect(W-WALL_WIDTH, camY-100, WALL_WIDTH, H+200);
            ctx.strokeStyle = "#333";
            ctx.beginPath();
            let shift = (camY % 100);
            for(let y = camY - shift; y < camY+H; y+=50) {
                ctx.moveTo(5, y); ctx.lineTo(30, y+20); ctx.lineTo(10, y+40);
                ctx.moveTo(W-5, y); ctx.lineTo(W-30, y+20); ctx.lineTo(W-10, y+40);
            }
            ctx.stroke();

            // Platforms (Restored HD Style: Stone + Moss)
            platforms.forEach(p => {
                // Stone body
                ctx.fillStyle = "#222";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Moss top
                ctx.fillStyle = "#345";
                ctx.fillRect(p.x, p.y, p.w, 4);
                // Cracks
                ctx.strokeStyle = "#000"; ctx.lineWidth=1;
                ctx.beginPath();
                ctx.moveTo(p.x+10, p.y+5); ctx.lineTo(p.x+20, p.y+15);
                ctx.stroke();
            });

            // Enemies
            enemies.forEach(e => {
                if (e.type === 'crawler') {
                    ctx.fillStyle = "#a33";
                    ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI, true); ctx.fill(); 
                    ctx.strokeStyle = "#a33"; ctx.beginPath();
                    let l = Math.sin(frame*0.5)*5;
                    ctx.moveTo(e.x-8, e.y); ctx.lineTo(e.x-15+l, e.y+10);
                    ctx.moveTo(e.x+8, e.y); ctx.lineTo(e.x+15-l, e.y+10); ctx.stroke();
                } else if (e.type === 'bat') {
                    ctx.fillStyle = "#33a"; ctx.beginPath(); ctx.arc(e.x, e.y, 8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#44c"; let wY = Math.sin(frame*0.5)*10;
                    ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x-15,e.y-10+wY); ctx.lineTo(e.x-5,e.y+5); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+15,e.y-10+wY); ctx.lineTo(e.x+5,e.y+5); ctx.fill();
                } else {
                    ctx.fillStyle = "#222"; ctx.strokeStyle = "#f0f"; ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#f0f"; ctx.beginPath(); ctx.arc(e.x, e.y, 4+Math.sin(frame*0.2)*2, 0, Math.PI*2); ctx.fill();
                }
            });

            // Items
            items.forEach(it => {
                let c = getBuffColor(it.type);
                ctx.fillStyle = c; ctx.shadowBlur = 10; ctx.shadowColor=c;
                ctx.beginPath(); ctx.arc(it.x, it.y+Math.sin(frame*0.1)*3, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            });

            // Particles
            particles.forEach((p, i) => {
                if (p.type === 'slash') {
                    p.life--;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.facing, 1);
                    ctx.beginPath(); ctx.arc(10, 0, 35, -Math.PI/3, Math.PI/3);
                    ctx.strokeStyle = player.buff==='orange'?"#fa0":"#fff";
                    ctx.lineWidth = 4 * (p.life/10); ctx.shadowBlur=10; ctx.shadowColor=ctx.strokeStyle;
                    ctx.stroke(); ctx.restore();
                } else {
                    p.x+=p.vx; p.y+=p.vy; p.life--;
                    ctx.fillStyle=p.c; ctx.fillRect(p.x, p.y, 3, 3);
                }
                if(p.life<=0) particles.splice(i,1);
            });

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle="#f0f"; ctx.shadowBlur=10; ctx.shadowColor="#f0f";
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            });

            // Player (HD Human)
            if (player.invincible <= 0 || frame % 4 === 0) {
                drawHuman(player.x, player.y, player.w, player.h, player.facing, player.animState, player.animTimer);
            }

            ctx.restore();

            // Vignette
            let rad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H*0.9);
            rad.addColorStop(0, "transparent");
            rad.addColorStop(1, "rgba(0,0,0,0.6)");
            ctx.fillStyle = rad;
            ctx.fillRect(0,0,W,H);
        }

        function drawHuman(x, y, w, h, facing, state, timer) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(facing, 1);
            
            // Skeleton Setup
            let headY = -h/2;
            let neckY = -h/2 + 10;
            let hipY = 0;
            let kneeY = 15;
            let footY = 28;

            // Anim Logic
            let armAngle = 0;
            let legAngle = 0;
            let bob = 0;

            if (state === 'idle') {
                bob = Math.sin(timer * 0.1) * 1;
                armAngle = Math.sin(timer * 0.05) * 0.1;
            } else if (state === 'run') {
                legAngle = Math.sin(timer * 0.3) * 0.8;
                armAngle = -legAngle;
                bob = Math.abs(Math.sin(timer * 0.6)) * 2;
            } else if (state === 'jump') {
                legAngle = 0.5; armAngle = -2;
            } else if (state === 'fall') {
                legAngle = 0.2; armAngle = -2.5;
            } else if (state === 'attack') {
                // Sword Swing Logic tied to cooldown (20 frames)
                // 1.0 -> 0.0 progress
                let progress = player.atkCooldown / 20; 
                armAngle = -Math.PI/2 + (Math.sin((1-progress) * Math.PI) * 2); 
            }

            // Draw Style
            ctx.strokeStyle = "#fff"; ctx.lineCap = "round"; ctx.lineJoin = "round";

            // Back Leg
            ctx.lineWidth = 6; ctx.strokeStyle = "#555"; 
            ctx.beginPath(); ctx.moveTo(0, hipY+bob); 
            ctx.lineTo(-Math.sin(legAngle)*10, kneeY+bob); 
            ctx.lineTo(-Math.sin(legAngle)*15, footY+bob); ctx.stroke();

            // Back Arm
            ctx.lineWidth = 5; ctx.beginPath(); 
            ctx.moveTo(0, neckY+5+bob); 
            ctx.lineTo(Math.sin(armAngle)*10, neckY+15+bob); 
            ctx.lineTo(Math.sin(armAngle)*15, neckY+25+bob); ctx.stroke();

            // Torso
            ctx.fillStyle = "#1e2840"; 
            ctx.beginPath(); ctx.moveTo(-6, neckY+bob); ctx.lineTo(6, neckY+bob); 
            ctx.lineTo(4, hipY+bob); ctx.lineTo(-4, hipY+bob); ctx.fill();
            ctx.fillStyle = "#d4af37"; ctx.fillRect(-2, neckY+bob, 4, 15);

            // Head
            ctx.fillStyle = "#ffccaa"; ctx.beginPath(); ctx.arc(0, headY+bob, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#444"; ctx.beginPath(); ctx.arc(0, headY+bob-2, 7, Math.PI, 0); ctx.fill();

            // Front Leg
            ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; 
            ctx.beginPath(); ctx.moveTo(0, hipY+bob); 
            ctx.lineTo(Math.sin(legAngle)*10, kneeY+bob); 
            ctx.lineTo(Math.sin(legAngle)*15, footY+bob); ctx.stroke();

            // Front Arm (Sword Arm)
            // Calculate Elbow and Hand position based on armAngle
            let shoulderX = 0; let shoulderY = neckY + 5 + bob;
            let elbowX = Math.cos(armAngle + Math.PI/2) * 12; // Simple IK-ish
            let elbowY = shoulderY + Math.sin(armAngle + Math.PI/2) * 12;
            let handX = elbowX + Math.cos(armAngle + Math.PI/2) * 12;
            let handY = elbowY + Math.sin(armAngle + Math.PI/2) * 12;

            ctx.lineWidth = 5; ctx.strokeStyle = "#fff";
            ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); 
            ctx.lineTo(elbowX, elbowY); 
            ctx.lineTo(handX, handY); ctx.stroke();

            // Sword (attached to hand)
            ctx.save();
            ctx.translate(handX, handY);
            ctx.rotate(armAngle + 2); // Offset sword angle
            ctx.fillStyle = "#d4af37"; ctx.fillRect(-2, -2, 4, 8); // Hilt
            ctx.fillStyle = (player.buff === 'orange') ? "#ffaa00" : "#00ffff"; // Blade
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(-1, -30, 2, 30);
            ctx.restore();

            if (player.buff === 'blue') {
                ctx.strokeStyle = "#44f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            if(gameActive) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
