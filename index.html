<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: Arcade Combat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            touch-action: none;
            user-select: none;
            font-family: 'Cinzel', serif;
        }

        canvas { display: block; width: 100%; height: 100vh; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* HUD */
        .hud-panel {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            color: #d4af37;
            text-shadow: 0 2px 4px #000;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .bar-wrap {
            width: 160px; height: 14px; background: #111; border: 1px solid #444;
            margin-bottom: 5px; position: relative; overflow: hidden;
        }
        .hp-fill { 
            height: 100%; background: linear-gradient(90deg, #8a0e0e, #ff3333); 
            width: 100%; transition: width 0.1s; 
        }

        .flask-slot {
            display: flex; gap: 8px; margin-top: 5px; align-items: center;
            font-size: 0.8rem; color: #ccc;
        }
        .flask-icon {
            width: 18px; height: 18px; border-radius: 50%;
            background: #222; border: 1px solid #555;
            box-shadow: 0 0 5px #000;
        }

        /* Controls */
        .controls-area {
            height: 250px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
            pointer-events: auto;
            padding-bottom: 40px;
        }

        /* Joystick */
        .stick-zone { width: 45%; height: 100%; position: relative; }
        .stick-base {
            position: absolute; width: 90px; height: 90px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            border-radius: 50%; display: none; pointer-events: none;
            backdrop-filter: blur(2px);
        }
        .stick-knob {
            position: absolute; width: 40px; height: 40px;
            background: rgba(212, 175, 55, 0.8);
            border-radius: 50%; top: 25px; left: 25px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Buttons */
        .btn-zone {
            width: 50%; height: 100%;
            display: flex; justify-content: flex-end; align-items: flex-end;
            gap: 20px;
        }
        .action-btn {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: #fff; font-size: 2rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        
        #btn-atk { border-color: #ff4444; color: #ff4444; margin-bottom: 40px; margin-right: 10px; }
        #btn-jump { border-color: #44ff44; color: #44ff44; width: 70px; height: 70px; font-size: 1.5rem; margin-bottom: 10px; }

        /* Screens */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,8,0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; color: #d4af37; text-align: center;
        }
        .hidden { display: none !important; }
        
        .menu-btn {
            margin-top: 30px; padding: 15px 50px;
            font-size: 1.2rem; font-family: 'Cinzel';
            background: transparent; color: #d4af37;
            border: 2px solid #d4af37; cursor: pointer;
            text-transform: uppercase;
        }
        
        .toast {
            position: absolute; top: 25%; width: 100%; text-align: center;
            font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px #f00;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>
                <div style="font-size: 0.7rem; color:#aaa; margin-bottom:4px;">HEALTH</div>
                <div class="bar-wrap"><div id="hp-bar" class="hp-fill"></div></div>
                <div class="flask-slot">
                    <div id="buff-icon" class="flask-icon"></div>
                    <span id="buff-text">NO BUFFS</span>
                </div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 0.7rem; color: #aaa;">DEPTH</div>
                <div id="score-disp" style="font-size: 2.2rem; font-weight:bold; color:#fff;">0m</div>
            </div>
        </div>
        
        <div id="toast-msg" class="toast">IMPACT!</div>

        <div class="controls-area">
            <div class="stick-zone" id="joystick">
                <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
            </div>
            <div class="btn-zone">
                <div class="action-btn" id="btn-atk">⚔</div>
                <div class="action-btn" id="btn-jump">⭱</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 0; text-shadow: 0 0 20px cyan;">ER TOSTIK</h1>
        <p style="color: #888; letter-spacing: 3px; margin-top:5px;">ARCADE DESCENT</p>
        <p style="font-size: 0.8rem; color:#666; max-width: 300px; margin-top: 20px;">
            Aim Joystick to Slash.<br>
            Fall on heads to <span style="color:#fff">STOMP</span>.<br>
            Hit projectiles to deflect.
        </p>
        <button class="menu-btn" onclick="startGame()">Descend</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #ff4444; font-size: 3rem;">FALLEN</h1>
        <p id="final-depth" style="font-size: 2rem; color: #fff; margin: 10px 0;">0m</p>
        <button class="menu-btn" onclick="startGame()">Rise</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // ============================================================================
        // WARRIOR SPRITE SYSTEM - Ancient Central Asian Character
        // ============================================================================

        const SPRITE_SCALE = 2; // Scale multiplier for the 32x32 sprite

        // Color Palette
        const COLORS = {
            // Helmet & Metal
            HELMET_DARK: '#2d3561',
            HELMET_MID: '#4a5a8a',
            HELMET_LIGHT: '#6b7db5',
            HELMET_SHINE: '#9fb3ff',
            GOLD: '#ffd700',
            GOLD_DARK: '#b8860b',
            
            // Armor
            ARMOR_DARK: '#1a4d5c',
            ARMOR_MID: '#2d7a8f',
            ARMOR_LIGHT: '#45a8c5',
            ARMOR_SHINE: '#7fd8f0',
            
            // Clothing
            TUNIC_DARK: '#8b0000',
            TUNIC_MID: '#c41e3a',
            TUNIC_LIGHT: '#e63946',
            
            // Scarf (Signature cyan/turquoise)
            SCARF_DARK: '#00a8a8',
            SCARF_MID: '#00d4d4',
            SCARF_LIGHT: '#00ffff',
            SCARF_GLOW: '#b0ffff',
            
            // Belt
            BELT_LEATHER: '#8b4513',
            BELT_BUCKLE: '#ffd700',
            
            // Boots
            BOOT_DARK: '#3d2817',
            BOOT_MID: '#5c4033',
            BOOT_LIGHT: '#7d5a3d',
            
            // Skin
            SKIN_DARK: '#8d6e63',
            SKIN_MID: '#a1887f',
            SKIN_LIGHT: '#bcaaa4',
            
            // Sword
            BLADE_DARK: '#b0c4de',
            BLADE_MID: '#d3e5f5',
            BLADE_LIGHT: '#f0f8ff',
            HILT_GOLD: '#daa520',
            HILT_JEWEL: '#ff0000',
        };

        class WarriorSprite {
            constructor() {
                this.sprites = {};
                this.initializeAllSprites();
            }

            createEmptySprite() {
                const sprite = [];
                for (let y = 0; y < 32; y++) {
                    sprite[y] = new Array(32).fill(null);
                }
                return sprite;
            }

            // Base idle frame
            createIdleFrame1() {
                const s = this.createEmptySprite();
                
                // Plume
                s[3][15] = COLORS.SCARF_LIGHT; s[3][16] = COLORS.SCARF_MID;
                s[4][14] = COLORS.SCARF_MID; s[4][15] = COLORS.SCARF_LIGHT;
                s[4][16] = COLORS.SCARF_MID; s[4][17] = COLORS.SCARF_DARK;
                s[5][15] = COLORS.SCARF_MID; s[5][16] = COLORS.SCARF_DARK;
                
                // Helmet
                s[6][15] = COLORS.HELMET_SHINE; s[6][16] = COLORS.HELMET_LIGHT;
                s[7][14] = COLORS.HELMET_LIGHT; s[7][15] = COLORS.HELMET_SHINE;
                s[7][16] = COLORS.HELMET_MID; s[7][17] = COLORS.HELMET_DARK;
                for (let x = 13; x <= 18; x++) s[8][x] = x <= 15 ? COLORS.HELMET_LIGHT : COLORS.HELMET_MID;
                for (let x = 12; x <= 19; x++) s[9][x] = x <= 14 ? COLORS.HELMET_LIGHT : x <= 16 ? COLORS.HELMET_MID : COLORS.HELMET_DARK;
                
                // Gold rim
                for (let x = 12; x <= 19; x++) s[10][x] = COLORS.GOLD;
                s[10][15] = COLORS.GOLD_DARK; s[10][16] = COLORS.GOLD_DARK;
                
                // Face
                s[11][13] = COLORS.HELMET_MID; s[11][14] = COLORS.SKIN_DARK;
                s[11][15] = COLORS.SKIN_MID; s[11][16] = COLORS.SKIN_MID;
                s[11][17] = COLORS.SKIN_DARK; s[11][18] = COLORS.HELMET_MID;
                s[12][13] = COLORS.HELMET_DARK; s[12][14] = COLORS.SKIN_MID;
                s[12][15] = COLORS.HELMET_DARK; s[12][16] = COLORS.HELMET_DARK;
                s[12][17] = COLORS.SKIN_MID; s[12][18] = COLORS.HELMET_DARK;
                
                // Scarf flow
                s[11][10] = COLORS.SCARF_DARK; s[11][11] = COLORS.SCARF_MID;
                s[12][9] = COLORS.SCARF_DARK; s[12][10] = COLORS.SCARF_LIGHT; s[12][11] = COLORS.SCARF_MID;
                s[13][8] = COLORS.SCARF_MID; s[13][9] = COLORS.SCARF_LIGHT; s[13][10] = COLORS.SCARF_GLOW;
                s[14][8] = COLORS.SCARF_DARK; s[14][9] = COLORS.SCARF_MID;
                s[15][8] = COLORS.SCARF_DARK;
                s[11][20] = COLORS.SCARF_MID; s[11][21] = COLORS.SCARF_DARK;
                s[12][20] = COLORS.SCARF_MID; s[12][21] = COLORS.SCARF_LIGHT; s[12][22] = COLORS.SCARF_DARK;
                s[13][21] = COLORS.SCARF_LIGHT; s[13][22] = COLORS.SCARF_GLOW; s[13][23] = COLORS.SCARF_MID;
                s[14][22] = COLORS.SCARF_MID; s[14][23] = COLORS.SCARF_DARK;
                s[15][23] = COLORS.SCARF_DARK;
                
                // Shoulders
                s[13][12] = COLORS.ARMOR_DARK; s[13][13] = COLORS.ARMOR_MID;
                s[14][11] = COLORS.ARMOR_DARK; s[14][12] = COLORS.ARMOR_LIGHT; s[14][13] = COLORS.ARMOR_MID;
                s[15][11] = COLORS.ARMOR_MID; s[15][12] = COLORS.ARMOR_LIGHT;
                s[13][18] = COLORS.ARMOR_MID; s[13][19] = COLORS.ARMOR_DARK;
                s[14][18] = COLORS.ARMOR_MID; s[14][19] = COLORS.ARMOR_LIGHT; s[14][20] = COLORS.ARMOR_DARK;
                s[15][19] = COLORS.ARMOR_LIGHT; s[15][20] = COLORS.ARMOR_MID;
                
                // Chest armor
                for (let y = 13; y <= 18; y++) {
                    for (let x = 14; x <= 17; x++) {
                        if (y === 13 || y === 15 || y === 17) {
                            s[y][x] = (x % 2 === 0) ? COLORS.ARMOR_LIGHT : COLORS.ARMOR_MID;
                        } else {
                            s[y][x] = (x % 2 === 0) ? COLORS.ARMOR_MID : COLORS.ARMOR_DARK;
                        }
                    }
                }
                s[15][15] = COLORS.GOLD; s[15][16] = COLORS.GOLD;
                s[16][15] = COLORS.GOLD_DARK; s[16][16] = COLORS.GOLD_DARK;
                
                // Belt
                for (let x = 13; x <= 18; x++) s[19][x] = COLORS.BELT_LEATHER;
                s[19][15] = COLORS.BELT_BUCKLE; s[19][16] = COLORS.BELT_BUCKLE;
                s[20][15] = COLORS.GOLD_DARK; s[20][16] = COLORS.GOLD_DARK;
                
                // Tunic edges
                for (let y = 17; y <= 18; y++) {
                    s[y][13] = COLORS.TUNIC_DARK; s[y][18] = COLORS.TUNIC_DARK;
                }
                
                // Legs
                for (let y = 20; y <= 25; y++) {
                    s[y][13] = y <= 22 ? COLORS.ARMOR_MID : COLORS.TUNIC_MID;
                    s[y][14] = y <= 22 ? COLORS.ARMOR_LIGHT : COLORS.TUNIC_LIGHT;
                    s[y][17] = y <= 22 ? COLORS.ARMOR_LIGHT : COLORS.TUNIC_LIGHT;
                    s[y][18] = y <= 22 ? COLORS.ARMOR_MID : COLORS.TUNIC_MID;
                }
                
                // Boots
                for (let y = 26; y <= 29; y++) {
                    s[y][13] = COLORS.BOOT_DARK; s[y][14] = COLORS.BOOT_MID;
                    s[y][15] = y === 29 ? COLORS.BOOT_MID : COLORS.BOOT_LIGHT;
                    s[y][16] = y === 29 ? COLORS.BOOT_MID : COLORS.BOOT_LIGHT;
                    s[y][17] = COLORS.BOOT_MID; s[y][18] = COLORS.BOOT_DARK;
                }
                
                // Sword sheathed
                s[16][19] = COLORS.HILT_GOLD; s[17][19] = COLORS.HILT_GOLD;
                s[17][20] = COLORS.HILT_JEWEL; s[18][19] = COLORS.HILT_GOLD;
                for (let y = 19; y <= 24; y++) {
                    s[y][19] = COLORS.BLADE_DARK;
                    if (y >= 20) s[y][20] = COLORS.BLADE_MID;
                }
                s[23][20] = COLORS.BLADE_LIGHT;
                
                // Left arm
                s[16][11] = COLORS.ARMOR_MID; s[16][12] = COLORS.ARMOR_LIGHT;
                s[17][11] = COLORS.TUNIC_MID; s[17][12] = COLORS.ARMOR_MID;
                s[18][11] = COLORS.TUNIC_MID; s[18][12] = COLORS.TUNIC_LIGHT;
                s[19][11] = COLORS.SKIN_MID; s[19][12] = COLORS.SKIN_LIGHT;
                s[20][11] = COLORS.SKIN_DARK; s[20][12] = COLORS.SKIN_MID;
                s[21][11] = COLORS.BOOT_DARK; s[21][12] = COLORS.BOOT_MID;
                
                return s;
            }

            createIdleFrame2() {
                const s = this.createIdleFrame1();
                // Breathing shift
                for (let y = 13; y <= 18; y++) {
                    for (let x = 11; x <= 20; x++) {
                        if (s[y][x] !== null) {
                            s[y - 1][x] = s[y][x];
                            if (y === 18) s[y][x] = null;
                        }
                    }
                }
                s[13][23] = COLORS.SCARF_LIGHT; s[14][24] = COLORS.SCARF_MID; s[15][24] = COLORS.SCARF_DARK;
                return s;
            }

            createRunFrame() {
                const s = this.createIdleFrame1();
                // Lean forward
                for (let y = 6; y <= 18; y++) {
                    for (let x = 0; x < 30; x++) {
                        s[y][x] = s[y][x + 2];
                    }
                }
                // Scarf streaming back
                for (let y = 12; y <= 16; y++) {
                    s[y][6] = COLORS.SCARF_LIGHT;
                    s[y][7] = COLORS.SCARF_MID;
                    s[y][8] = COLORS.SCARF_DARK;
                }
                return s;
            }

            createJumpFrame() {
                const s = this.createEmptySprite();
                const idle = this.createIdleFrame1();
                
                // Copy upper body shifted up
                for (let y = 3; y <= 18; y++) {
                    for (let x = 0; x < 32; x++) {
                        s[y - 2][x] = idle[y][x];
                    }
                }
                
                // Legs tucked
                for (let y = 18; y <= 23; y++) {
                    s[y][12] = COLORS.ARMOR_LIGHT; s[y][13] = COLORS.ARMOR_MID;
                    s[y][18] = COLORS.ARMOR_MID; s[y][19] = COLORS.ARMOR_LIGHT;
                }
                s[24][12] = COLORS.BOOT_MID; s[24][13] = COLORS.BOOT_DARK;
                s[24][18] = COLORS.BOOT_DARK; s[24][19] = COLORS.BOOT_MID;
                
                // Scarf flowing up
                s[14][9] = COLORS.SCARF_LIGHT; s[15][8] = COLORS.SCARF_GLOW;
                s[16][7] = COLORS.SCARF_MID; s[17][7] = COLORS.SCARF_DARK;
                s[14][22] = COLORS.SCARF_LIGHT; s[15][23] = COLORS.SCARF_GLOW;
                s[16][24] = COLORS.SCARF_MID; s[17][24] = COLORS.SCARF_DARK;
                
                return s;
            }

            createFallFrame() {
                const s = this.createEmptySprite();
                const idle = this.createIdleFrame1();
                
                // Copy upper body
                for (let y = 3; y <= 18; y++) {
                    for (let x = 0; x < 32; x++) {
                        s[y][x] = idle[y][x];
                    }
                }
                
                // Legs dangling
                for (let y = 19; y <= 28; y++) {
                    s[y][14] = (y >= 25) ? COLORS.BOOT_MID : COLORS.TUNIC_LIGHT;
                    s[y][17] = (y >= 25) ? COLORS.BOOT_MID : COLORS.TUNIC_LIGHT;
                }
                
                // Scarf flowing upward (iconic)
                for (let y = 11; y >= 4; y--) {
                    s[y][15] = COLORS.SCARF_LIGHT; s[y][16] = COLORS.SCARF_MID;
                }
                s[4][15] = COLORS.SCARF_GLOW; s[3][15] = COLORS.SCARF_LIGHT;
                s[2][15] = COLORS.SCARF_MID; s[1][16] = COLORS.SCARF_DARK;
                
                return s;
            }

            createAttackFrame() {
                const s = this.createIdleFrame1();
                
                // Remove sheathed sword
                for (let y = 16; y <= 24; y++) {
                    s[y][19] = null; s[y][20] = null;
                }
                
                // Sword slashing horizontal
                s[15][20] = COLORS.HILT_GOLD; s[15][21] = COLORS.HILT_JEWEL;
                s[16][20] = COLORS.HILT_GOLD;
                
                for (let x = 21; x <= 26; x++) {
                    s[15][x] = (x % 2 === 0) ? COLORS.BLADE_LIGHT : COLORS.BLADE_MID;
                    s[16][x] = COLORS.BLADE_DARK;
                }
                s[15][26] = COLORS.BLADE_LIGHT;
                
                // Motion blur
                s[14][24] = COLORS.SCARF_LIGHT; s[14][25] = COLORS.SCARF_MID;
                s[17][24] = COLORS.SCARF_MID;
                
                return s;
            }

            createCrouchFrame() {
                const s = this.createEmptySprite();
                const idle = this.createIdleFrame1();
                
                // Compressed
                for (let y = 3; y <= 12; y++) {
                    for (let x = 0; x < 32; x++) {
                        s[y + 4][x] = idle[y][x];
                    }
                }
                
                for (let y = 13; y <= 15; y++) {
                    for (let x = 11; x <= 20; x++) {
                        s[y + 4][x] = idle[y][x];
                    }
                }
                
                for (let y = 22; y <= 29; y++) {
                    for (let x = 12; x <= 19; x++) {
                        s[y][x] = idle[y - 2][x];
                    }
                }
                
                s[28][10] = COLORS.SCARF_MID; s[29][9] = COLORS.SCARF_DARK;
                s[28][21] = COLORS.SCARF_MID; s[29][22] = COLORS.SCARF_DARK;
                
                return s;
            }

            initializeAllSprites() {
                this.sprites = {
                    idle: [this.createIdleFrame1(), this.createIdleFrame2()],
                    run: [this.createRunFrame()],
                    jump: [this.createJumpFrame()],
                    fall: [this.createFallFrame()],
                    attack: [this.createAttackFrame()],
                    crouch: [this.createCrouchFrame()]
                };
            }

            drawSprite(ctx, animName, frame, x, y, facing, invincible, flashFrame) {
                const anim = this.sprites[animName] || this.sprites.idle;
                const sprite = anim[frame % anim.length];
                
                // Invincibility flash
                if (invincible && flashFrame) return;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(facing * SPRITE_SCALE, SPRITE_SCALE);
                
                // Draw each pixel
                for (let py = 0; py < 32; py++) {
                    for (let px = 0; px < 32; px++) {
                        const color = sprite[py][px];
                        if (color) {
                            ctx.fillStyle = color;
                            ctx.fillRect(px - 16, py - 16, 1, 1);
                        }
                    }
                }
                
                ctx.restore();
            }
        }

        const warriorSprite = new WarriorSprite();

        // --- Config ---
        let W, H;
        const GRAVITY = 0.5;
        const FRICTION_STONE = 0.85;
        const FRICTION_ICE = 0.98;
        const WALL_GAP = 300; 
        const FALL_DMG_THRESHOLD = 450;
        
        // --- Enemy Sprites ---
        const SPRITE_CRAWLER = [
            "00111100",
            "01111110",
            "11011011",
            "11111111",
            "10100101"
        ];
        const SPRITE_BAT = [
            "10000001",
            "01000010",
            "01100110",
            "00111100",
            "00011000"
        ];
        const SPRITE_SENTINEL = [
            "00111100",
            "01100110",
            "11011011",
            "10011001",
            "11011011",
            "01100110",
            "00111100"
        ];

        // --- State ---
        let gameActive = false;
        let camY = 0;
        let score = 0;
        let frame = 0;
        let shake = 0;
        let inputs = { x: 0, y: 0, jump: false, atk: false, activeStick: false };

        // --- Objects ---
        let player = {
            x: 0, y: 0, w: 20, h: 55,
            vx: 0, vy: 0,
            hp: 100, maxHp: 100,
            facing: 1,
            aimAngle: 0,
            grounded: false,
            wallSliding: false,
            fallStartY: 0,
            animState: 'idle',
            animFrame: 0,
            animTimer: 0,
            invincible: 0,
            buff: null, buffTimer: 0,
            atkCooldown: 0,
            friction: FRICTION_STONE
        };

        let platforms = [];
        let particles = [];
        let enemies = [];
        let items = [];
        let projectiles = [];
        let bgStars = [];

        // --- Input ---
        const stickZone = document.getElementById('joystick');
        const stickBase = document.getElementById('stick-base');
        const stickKnob = document.getElementById('stick-knob');
        let touchId = null; 
        let startX, startY;

        stickZone.addEventListener('touchstart', e => {
            e.preventDefault();
            let t = e.changedTouches[0];
            touchId = t.identifier;
            startX = t.clientX; startY = t.clientY;
            let rect = stickZone.getBoundingClientRect();
            stickBase.style.display = 'block';
            stickBase.style.left = (startX - rect.left - 45) + 'px';
            stickBase.style.top = (startY - rect.top - 45) + 'px';
            stickKnob.style.transform = `translate(0px, 0px)`;
            inputs.activeStick = true;
        }, {passive: false});

        stickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === touchId) {
                    let t = e.changedTouches[i];
                    let dx = t.clientX - startX;
                    let dy = t.clientY - startY;
                    let dist = Math.hypot(dx, dy);
                    let max = 45;
                    if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                    stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputs.x = dx / max; 
                    inputs.y = dy / max;
                }
            }
        }, {passive: false});

        const resetStick = () => { touchId = null; inputs.x = 0; inputs.y = 0; stickBase.style.display = 'none'; inputs.activeStick = false; };
        stickZone.addEventListener('touchend', resetStick);
        stickZone.addEventListener('touchcancel', resetStick);

        const bindBtn = (id, key) => {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); inputs[key] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); inputs[key] = false; });
        };
        bindBtn('btn-jump', 'jump');
        bindBtn('btn-atk', 'atk');

        // --- Core ---
        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            bgStars = [];
            for(let i=0; i<60; i++) bgStars.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2});
        }
        window.addEventListener('resize', resize);
        resize();

        function getTunnelOffset(y) { return Math.sin(y * 0.002) * (W * 0.25); }
        function showToast(msg, color="#fff") {
            const t = document.getElementById('toast-msg'); t.innerText = msg; t.style.color = color; t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 1500);
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            player.x = W/2; player.y = 100; player.vx = 0; player.vy = 0;
            player.hp = 100; player.buff = null; player.fallStartY = player.y;
            player.animState = 'idle'; player.animFrame = 0; player.animTimer = 0;
            camY = 0; score = 0;
            platforms = []; items = []; particles = []; enemies = []; projectiles = [];
            platforms.push({x: W/2-100, y: 300, w: 200, h: 20, type:'stone'});
            genWorld(350, 2000);
            gameActive = true;
            loop();
        }

        function genWorld(sy, ey) {
            let y = sy;
            while(y < ey) {
                y += 90 + Math.random() * 80;
                let offset = getTunnelOffset(y);
                let tunnelCenter = (W/2) + offset;
                let w = 80 + Math.random() * 100;
                let minX = tunnelCenter - (WALL_GAP/2) + 20;
                let maxX = tunnelCenter + (WALL_GAP/2) - w - 20;
                let x = minX + Math.random() * (maxX - minX);
                
                let pType = 'stone';
                if (Math.random() < 0.2) pType = 'ice';
                else if (Math.random() < 0.2) pType = 'slime';

                platforms.push({x, y, w, h: 25, type: pType});

                if (Math.random() < 0.4 && y > 500) {
                    let type = 'crawler';
                    if (y > 1000 && Math.random() > 0.6) type = 'bat';
                    if (y > 2000 && Math.random() > 0.8) type = 'sentinel';
                    enemies.push({
                        type: type,
                        x: x + w/2, y: y - 20,
                        w: 30, h: 30,
                        vx: type === 'sentinel' ? 0 : 1,
                        hp: type === 'sentinel' ? 40 : 20,
                        patrol: [x, x+w],
                        timer: 0,
                    });
                }
                if(Math.random() < 0.1) {
                    let types = ['red', 'blue', 'green', 'orange'];
                    items.push({ x: x + w/2, y: y - 30, type: types[Math.floor(Math.random()*types.length)] });
                }
            }
        }

        function update() {
            if(!gameActive) return;
            frame++;
            
            // Aiming
            if (inputs.activeStick && (Math.abs(inputs.x) > 0.1 || Math.abs(inputs.y) > 0.1)) {
                player.aimAngle = Math.atan2(inputs.y, inputs.x);
                if (inputs.x !== 0) player.facing = Math.sign(inputs.x);
            } else {
                player.aimAngle = (player.facing === 1) ? 0 : Math.PI;
            }

            // Physics
            player.vx = inputs.x * 5.5;
            player.vy += GRAVITY;
            if(player.buff === 'green' && player.vy > 2) player.vy = 2;
            if (player.vy < 0) player.fallStartY = player.y;

            player.x += player.vx;
            player.y += player.vy;
            player.vx *= player.friction;

            // Wall Slide
            let tunnelOffset = getTunnelOffset(player.y);
            let leftWall = (W/2) + tunnelOffset - (WALL_GAP/2);
            let rightWall = (W/2) + tunnelOffset + (WALL_GAP/2);
            player.wallSliding = false;

            if(player.x < leftWall + 10) { 
                player.x = leftWall + 10; player.vx = 0; 
                if(player.vy > 0) { 
                    player.vy*=0.8; player.fallStartY = player.y; player.wallSliding = true; player.facing = 1;
                }
            }
            if(player.x > rightWall - 10) { 
                player.x = rightWall - 10; player.vx = 0; 
                if(player.vy > 0) { 
                    player.vy*=0.8; player.fallStartY = player.y; player.wallSliding = true; player.facing = -1;
                }
            }

            // Animation State
            if (player.animState !== 'attack') {
                if (player.wallSliding) player.animState = 'climb';
                else if (!player.grounded) player.animState = player.vy < 0 ? 'jump' : 'fall';
                else if (Math.abs(inputs.x) > 0.1) player.animState = 'run';
                else player.animState = 'idle';
            }
            player.animTimer++;
            if (player.animTimer > 15) {
                player.animTimer = 0;
                player.animFrame++;
            }

            // Jump
            if(inputs.jump) {
                if (player.grounded) {
                    player.vy = -12.5; player.grounded = false; player.fallStartY = player.y;
                    spawnParticles(player.x, player.y + player.h/2, '#888', 5);
                } else if (player.wallSliding) {
                    player.vy = -12.5; player.vx = player.facing === 1 ? 10 : -10;
                    player.wallSliding = false;
                }
            }

            // Attack
            if(inputs.atk && player.atkCooldown <= 0) {
                player.atkCooldown = 20;
                player.animState = 'attack';
                player.animTimer = 0;
                player.animFrame = 0;
                
                let slashX = player.x + Math.cos(player.aimAngle) * 30;
                let slashY = player.y + Math.sin(player.aimAngle) * 30;
                spawnSlashVisual(slashX, slashY, player.aimAngle);
                
                let hitDist = 45;
                let dmg = player.buff === 'orange' ? 40 : 20;

                enemies.forEach(e => {
                    if (Math.hypot((player.x + Math.cos(player.aimAngle)*30) - e.x, (player.y + Math.sin(player.aimAngle)*30) - e.y) < hitDist) {
                        e.hp -= dmg; spawnParticles(e.x, e.y, '#f00', 8); shake = 6;
                    }
                });

                for(let i=projectiles.length-1; i>=0; i--) {
                    let p = projectiles[i];
                    if (Math.hypot((player.x + Math.cos(player.aimAngle)*30) - p.x, (player.y + Math.sin(player.aimAngle)*30) - p.y) < hitDist) {
                        projectiles.splice(i, 1);
                        spawnParticles(p.x, p.y, '#fff', 10);
                        showToast("DEFLECT!", "#0ff");
                        shake = 3;
                    }
                }
            }
            if(player.atkCooldown > 0) player.atkCooldown--;
            if (player.atkCooldown < 10 && player.animState === 'attack') player.animState = 'idle';

            if(player.invincible > 0) player.invincible--;
            if(player.buffTimer > 0) player.buffTimer--; else player.buff = null;

            // Platforms
            let wasGrounded = player.grounded;
            player.grounded = false;
            player.friction = FRICTION_STONE;

            if(player.vy > 0) {
                platforms.forEach(p => {
                    if(player.x > p.x && player.x < p.x + p.w &&
                       player.y + player.h/2 >= p.y &&
                       player.y + player.h/2 <= p.y + p.h + player.vy) {
                        
                        if (!wasGrounded) {
                            let fallDist = player.y - player.fallStartY;
                            if (fallDist > FALL_DMG_THRESHOLD && player.buff !== 'green') {
                                let dmg = Math.floor((fallDist - FALL_DMG_THRESHOLD) / 10);
                                player.hp -= dmg; shake = 15; spawnParticles(player.x, p.y, '#fff', 15);
                                showToast(`FALL DMG -${dmg}`, "#f44");
                            }
                            player.fallStartY = player.y;
                        }

                        if (p.type === 'ice') player.friction = FRICTION_ICE;
                        if (p.type === 'slime') {
                            player.vy = -15;
                            spawnParticles(player.x, p.y, '#0f0', 5);
                        } else {
                            player.grounded = true; player.vy = 0; player.y = p.y - player.h/2;
                        }
                    }
                });
            } else { player.fallStartY = player.y; }

            // Enemies
            enemies.forEach((e, i) => {
                if(e.hp <= 0) { enemies.splice(i, 1); return; }

                if (e.type === 'crawler') {
                    e.x += e.vx; if(e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;
                } else if (e.type === 'bat') {
                    e.x += Math.sin(frame * 0.05) * 3;
                    e.y += (player.y - e.y) * 0.02;
                } else if (e.type === 'sentinel') {
                    e.timer++;
                    if (e.timer > 120) {
                        let angle = Math.atan2(player.y - e.y, player.x - e.x);
                        projectiles.push({x: e.x, y: e.y, vx: Math.cos(angle)*5, vy: Math.sin(angle)*5, life: 100});
                        e.timer = 0;
                    }
                }

                if (player.vy > 0 && Math.abs(player.x - e.x) < 20 && player.y < e.y - 10 && player.y > e.y - 40) {
                    enemies.splice(i, 1);
                    player.vy = -12;
                    spawnParticles(e.x, e.y, '#f00', 10);
                    showToast("CRUSH!", "#fff");
                    shake = 5;
                    return;
                }

                if (player.invincible <= 0 && Math.hypot(player.x - e.x, (player.y-10) - e.y) < 25) {
                    if (player.buff === 'blue') {
                        player.buff = null; player.invincible = 30; e.vx *= -3;
                    } else {
                        player.hp -= 15; shake = 10; player.invincible = 60;
                        player.vy = -6; player.vx = -Math.sign(e.x - player.x) * 8;
                    }
                }
            });

            projectiles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) projectiles.splice(i, 1);
                else if (player.invincible <= 0 && Math.hypot(player.x - p.x, (player.y-10) - p.y) < 20) {
                    player.hp -= 10; player.invincible = 30; projectiles.splice(i, 1);
                }
            });

            items.forEach((it, i) => {
                if(Math.hypot(player.x - it.x, player.y - it.y) < 30) {
                    items.splice(i, 1); applyBuff(it.type);
                }
            });

            if(player.hp <= 0) { gameActive = false; document.getElementById('game-over').classList.remove('hidden'); document.getElementById('final-depth').innerText = Math.floor(score/10) + "m"; }
            
            let targetY = player.y - H * 0.4;
            if(targetY > camY) camY = targetY;
            if(player.y > score) score = player.y;

            if(platforms[platforms.length-1].y < camY + H * 1.5) genWorld(platforms[platforms.length-1].y, platforms[platforms.length-1].y + 1000);
            if(platforms[0].y < camY - 200) platforms.shift();
            items = items.filter(i => i.y > camY - 200);
            enemies = enemies.filter(e => e.y > camY - 200);

            updateUI();
            if(shake > 0) shake *= 0.9;
        }

        function applyBuff(type) {
            if(type === 'red') { player.hp = Math.min(100, player.hp + 30); showToast("HEALED", "#f44"); }
            else { player.buff = type; player.buffTimer = 900; showToast(type.toUpperCase(), "#fff"); }
        }

        function updateUI() {
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
            document.getElementById('score-disp').innerText = Math.floor(score/10) + 'm';
            const bTxt = document.getElementById('buff-text');
            const bIcon = document.getElementById('buff-icon');
            if (player.buff) {
                bTxt.innerText = `${player.buff.toUpperCase()} (${Math.ceil(player.buffTimer/60)}s)`;
                bIcon.style.backgroundColor = getBuffColor(player.buff);
            } else { bTxt.innerText = "NO BUFFS"; bIcon.style.backgroundColor = "#222"; }
        }

        function spawnParticles(x, y, c, n) {
            for(let i=0;i<n;i++) particles.push({x, y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:30, c});
        }
        function spawnSlashVisual(x, y, angle) {
            particles.push({x, y, type:'slash', life:10, angle: angle, timer:0});
        }
        function getBuffColor(t) { if(t==='red') return '#f44'; if(t==='blue') return '#44f'; if(t==='green') return '#4f4'; return '#fa0'; }

        // --- Render ---
        function drawSprite(ctx, sprite, x, y, size, color) {
            ctx.fillStyle = color;
            let rows = sprite.length;
            let cols = sprite[0].length;
            let startX = x - (cols * size) / 2;
            let startY = y - (rows * size) / 2;
            
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    if(sprite[r][c] === '1') {
                        ctx.fillRect(startX + c*size, startY + r*size, size, size);
                    }
                }
            }
        }

        function draw() {
            let depthFactor = Math.min(1, score / 15000);
            let r = 20 + (30*depthFactor);
            let b = 50 - (20*depthFactor);
            ctx.fillStyle = `rgb(${r*0.5},20,${b*0.5})`;
            ctx.fillRect(0,0,W,H);

            ctx.fillStyle = "rgba(255,255,255,0.2)";
            bgStars.forEach(s => {
                let sy = (s.y - camY * 0.5) % H; if(sy<0) sy+=H;
                ctx.fillRect(s.x, sy, s.s, s.s);
            });

            ctx.save();
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake - camY);

            ctx.fillStyle = "#111";
            let startDrawY = Math.floor(camY / 20) * 20;
            for(let y = startDrawY; y < camY + H + 50; y += 20) {
                let off = getTunnelOffset(y);
                let cx = (W/2) + off;
                ctx.fillRect(0, y, cx - (WALL_GAP/2), 22);
                ctx.fillRect(cx + (WALL_GAP/2), y, W - (cx + WALL_GAP/2), 22);
            }

            platforms.forEach(p => {
                if (p.type === 'stone') {
                    ctx.fillStyle = "#222"; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "#453"; ctx.fillRect(p.x, p.y, p.w, 4);
                } else if (p.type === 'ice') {
                    ctx.fillStyle = "#aaf"; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "#fff"; ctx.globalAlpha=0.3; ctx.fillRect(p.x, p.y, p.w, 4); ctx.globalAlpha=1;
                } else if (p.type === 'slime') {
                    ctx.fillStyle = "#282"; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "#afa"; ctx.beginPath(); 
                    for(let k=0; k<p.w; k+=10) { ctx.arc(p.x+k, p.y, 5, 0, Math.PI, true); } ctx.fill();
                }
            });

            enemies.forEach(e => {
                if (e.type === 'crawler') {
                    drawSprite(ctx, SPRITE_CRAWLER, e.x, e.y, 4, "#d33");
                } else if (e.type === 'bat') {
                    drawSprite(ctx, SPRITE_BAT, e.x, e.y + Math.sin(frame*0.5)*5, 4, "#55d");
                } else if (e.type === 'sentinel') {
                    drawSprite(ctx, SPRITE_SENTINEL, e.x, e.y, 4, "#d0d");
                }
            });

            items.forEach(it => {
                let c = getBuffColor(it.type);
                ctx.fillStyle = c; ctx.shadowBlur = 10; ctx.shadowColor=c;
                ctx.beginPath(); ctx.arc(it.x, it.y+Math.sin(frame*0.1)*3, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            });

            particles.forEach((p, i) => {
                if (p.type === 'slash') {
                    p.life--;
                    ctx.save(); ctx.translate(p.x, p.y); 
                    ctx.rotate(p.angle);
                    ctx.beginPath(); 
                    ctx.arc(0, 0, 45, -Math.PI/3, Math.PI/3); 
                    ctx.strokeStyle = player.buff==='orange'?"#fa0":"#fff";
                    ctx.lineWidth = 5 * (p.life/10); 
                    ctx.shadowBlur=15; ctx.shadowColor=ctx.strokeStyle;
                    ctx.stroke(); ctx.restore();
                } else {
                    p.x+=p.vx; p.y+=p.vy; p.life--;
                    ctx.fillStyle=p.c; ctx.fillRect(p.x, p.y, 3, 3);
                }
                if(p.life<=0) particles.splice(i,1);
            });

            projectiles.forEach(p => {
                ctx.fillStyle="#f0f"; ctx.shadowBlur=10; ctx.shadowColor="#f0f";
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            });

            // Draw the warrior sprite!
            let flashFrame = (frame % 4 === 0);
            warriorSprite.drawSprite(
                ctx,
                player.animState,
                player.animFrame,
                player.x,
                player.y,
                player.facing,
                player.invincible > 0,
                flashFrame
            );

            ctx.restore();

            let rad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H*0.9);
            rad.addColorStop(0, "transparent");
            rad.addColorStop(1, "rgba(0,0,0,0.6)");
            ctx.fillStyle = rad;
            ctx.fillRect(0,0,W,H);
        }

        function loop() {
            if(gameActive) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
