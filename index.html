<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Er Tostik: The Oracle's Message</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #000; 
            overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            touch-action: none; 
            user-select: none; 
            width: 100%; height: 100%; position: fixed;
        }

        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        /* UI LAYOUT */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10;
        }

        /* HUD */
        .hud {
            padding: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            text-shadow: 2px 2px 0 #000;
            opacity: 0; transition: opacity 1s;
        }
        .bar-wrap { width: 120px; height: 12px; background: #222; border: 2px solid #555; padding: 2px; box-shadow: 0 0 10px #000; }
        .hp-fill { width: 100%; height: 100%; background: #e00; transition: width 0.1s; }
        
        /* CONTROLS */
        .controls {
            padding: 20px; display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: auto; padding-bottom: 40px;
        }
        .stick-zone { width: 140px; height: 140px; position: relative; }
        .stick-base { 
            width: 100px; height: 100px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
            background: rgba(0,0,0,0.3); position: absolute; bottom: 10px; left: 10px; display: none;
        }
        .stick-knob {
            width: 45px; height: 45px; background: rgba(0,255,255,0.6); border-radius: 50%;
            position: absolute; top: 27.5px; left: 27.5px; box-shadow: 0 0 15px #0ff;
        }

        .btn-zone { display: flex; gap: 20px; padding-right: 10px; }
        .btn {
            width: 85px; height: 85px; border-radius: 50%; 
            border: 3px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5);
            color: #fff; font-size: 28px; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); transition: transform 0.1s; box-shadow: 0 4px 10px #000;
        }
        .btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .btn-atk { border-color: #f44; color: #f44; text-shadow: 0 0 10px #f00; }
        .btn-jump { border-color: #4f4; color: #4f4; text-shadow: 0 0 10px #0f0; }

        /* SCREENS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; text-align: center;
        }
        .hidden { display: none !important; }
        
        h1 { color: #0ff; margin-bottom: 20px; text-shadow: 0 0 20px #0ff; font-size: clamp(20px, 5vw, 40px); line-height: 1.5; }
        .start-btn {
            background: #000; color: #0ff; border: 3px solid #0ff;
            padding: 15px 40px; font-family: inherit; font-size: 16px; margin-top: 30px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px #0ff;
            animation: pulse 1.5s infinite;
        }
        .start-btn:active { background: #0ff; color: #000; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
        }
        
        .toast {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 20px; text-shadow: 0 0 10px #fff;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="theme.mp3" type="audio/mpeg"></audio>

    <canvas id="game"></canvas>
    <div class="scanlines"></div>

    <div id="ui-layer">
        <div class="hud" id="hud">
            <div>
                <div style="font-size: 8px; color: #0f0; margin-bottom: 5px;">VITALITY</div>
                <div class="bar-wrap"><div id="hp-bar" class="hp-fill"></div></div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 8px; color: #fa0; margin-bottom: 5px;">DEPTH</div>
                <div id="score-disp" style="font-size: 20px; color: #fff;">0 M</div>
            </div>
        </div>

        <div id="toast" class="toast">CRITICAL!</div>

        <div class="controls">
            <div class="stick-zone" id="stick-zone">
                <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
            </div>
            <div class="btn-zone">
                <div class="btn btn-atk" id="btn-atk">⚔</div>
                <div class="btn btn-jump" id="btn-jump">↑</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>ER TOSTIK:<br>UNDERWORLD</h1>
        <p style="color:#888; font-size: 10px; margin-bottom: 20px;">Use Headphones for Atmosphere</p>
        <button class="start-btn" onclick="initGame()">ENTER ABYSS</button>
    </div>

    <div id="game-over" class="screen hidden">
        <h1 style="color:#f00; text-shadow:0 0 20px #f00;">YOU DIED</h1>
        <p id="final-score" style="font-size: 18px; margin-bottom: 20px; color:#fff;">DEPTH: 0 M</p>
        <button class="start-btn" style="border-color:#f00; color:#f00; box-shadow:0 0 15px #f00;" onclick="location.reload()">TRY AGAIN</button>
    </div>

<script>
    // ==========================================
    // 1. AUDIO ENGINE (Web Audio API + MP3)
    // ==========================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;
    const bgm = document.getElementById('bgm');

    function initAudio() {
        actx = new AudioContext();
        bgm.volume = 0.5;
        bgm.play().catch(e => console.log("User interaction needed"));
    }

    const SFX = {
        playTone: (freq, type, duration, vol) => {
            if(!actx) return;
            const o = actx.createOscillator();
            const g = actx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, actx.currentTime);
            g.gain.setValueAtTime(vol, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + duration);
        },
        jump: () => SFX.playTone(150, 'square', 0.1, 0.1),
        land: () => SFX.playTone(80, 'sine', 0.1, 0.2),
        slash: () => {
            if(!actx) return;
            const buf = actx.createBuffer(1, actx.sampleRate*0.1, actx.sampleRate);
            const d = buf.getChannelData(0);
            for(let i=0; i<d.length; i++) d[i] = Math.random()*2-1;
            const src = actx.createBufferSource();
            src.buffer = buf;
            const g = actx.createGain();
            g.gain.value = 0.15;
            src.connect(g); g.connect(actx.destination);
            src.start();
        },
        hit: () => SFX.playTone(100, 'sawtooth', 0.2, 0.15),
        oracle: () => SFX.playTone(400, 'sine', 1.5, 0.05) // Mystical hum
    };

    // ==========================================
    // 2. GRAPHICS & ASSETS (High Fidelity)
    // ==========================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    let W, H;
    
    // Color Palette
    const C = {
        SKIN: '#d4a373', ARMOR_L: '#4cc9f0', ARMOR_D: '#3a0ca3',
        SCARF: '#f72585', GOLD: '#ffd60a',
        ORACLE_CLOAK: '#10002b', ORACLE_EYE: '#7209b7'
    };

    // Warrior Sprite (Procedural Pixel Art)
    const warriorSprite = {
        draw: function(ctx, x, y, facing, state, invinc) {
            if(invinc && Math.floor(Date.now()/50)%2===0) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(facing * 2, 2);
            
            // Scarf Physics
            ctx.fillStyle = C.SCARF;
            let flow = state === 'fall' ? -3 : Math.sin(Date.now()/100)*3;
            ctx.fillRect(-2, -14, 6, 4); // Neck
            ctx.fillRect(-5+flow, -14, 5, 12); // Tail

            // Head & Helmet
            ctx.fillStyle = C.SKIN; ctx.fillRect(-3, -24, 10, 10);
            ctx.fillStyle = '#bde0fe'; ctx.fillRect(-4, -26, 12, 6); // Helm
            ctx.fillRect(0, -29, 2, 3); // Spike

            // Body Armor
            ctx.fillStyle = C.ARMOR_D; ctx.fillRect(-5, -12, 14, 14);
            ctx.fillStyle = C.ARMOR_L; ctx.fillRect(-2, -10, 8, 8); // Chestplate
            ctx.fillStyle = C.GOLD; ctx.fillRect(-5, 0, 14, 3); // Belt

            // Weapon
            ctx.fillStyle = '#e9ecef';
            if (state === 'atk') {
                ctx.save(); ctx.translate(5, -5); ctx.rotate(Date.now()/50);
                ctx.fillRect(0, -20, 4, 35); // Blade
                ctx.fillStyle = C.GOLD; ctx.fillRect(-2, -2, 8, 4); // Hilt
                ctx.restore();
            } else {
                ctx.fillRect(8, -10, 4, 25); // Idle
            }

            // Legs
            ctx.fillStyle = '#212529';
            if (state === 'run') {
                let leg = Math.sin(Date.now()/60) * 8;
                ctx.fillRect(-5+leg, 3, 5, 12); ctx.fillRect(4-leg, 3, 5, 12);
            } else if (state === 'jump') {
                ctx.fillRect(-6, 0, 5, 10); ctx.fillRect(4, 2, 5, 10);
            } else {
                ctx.fillRect(-5, 3, 5, 12); ctx.fillRect(4, 3, 5, 12);
            }
            ctx.restore();
        }
    };

    // ==========================================
    // 3. GAME STATE & LOGIC
    // ==========================================
    let gameState = 'MENU';
    let camY = 0, score = 0, shake = 0;
    
    let player = { x:0, y:0, w:30, h:60, vx:0, vy:0, hp:100, maxHp:100, grounded:false, invincible:0, atkTimer:0, facing:1 };
    let platforms = [], entities = [], particles = [];
    
    // THE ORACLE OBJECT
    let oracle = {
        active: false,
        x: 0, y: 0,
        alpha: 1.0,
        message: "To save your brothers you have to descend to the underworld."
    };

    function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W; canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    function initGame() {
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').style.opacity = 1;
        gameState = 'PLAY';
        
        // Reset Player
        player.x = W/2 - 15;
        player.y = 100;
        player.vx = 0; player.vy = 0;
        player.hp = 100;
        
        // Reset World
        platforms = []; entities = []; particles = [];
        camY = 0; score = 0;
        
        // Create Starting Platform
        platforms.push({x: W/2 - 150, y: 200, w: 300, h: 30, type: 'stone'});
        
        // Spawn Oracle on Start Platform
        oracle.active = true;
        oracle.x = W/2 + 80; // Right side of platform
        oracle.y = 200 - 60; // Standing on top
        oracle.alpha = 1.0;
        SFX.oracle();

        // Generate rest of world
        genWorld(350, 2000);
        loop();
    }

    function genWorld(sy, ey) {
        for(let y = sy; y < ey; y += 100 + Math.random()*80) {
            const off = Math.sin(y*0.002) * (W*0.25);
            const cx = W/2 + off;
            
            if(Math.random() > 0.15) {
                const w = 80 + Math.random()*100;
                const x = cx - 100 + Math.random()*150;
                const type = Math.random()<0.1?'ice':(Math.random()<0.1?'slime':'stone');
                platforms.push({x, y, w, h: 25, type});
                
                // Enemies
                if(y > 600 && Math.random() < 0.3) {
                    const types = ['bat', 'slime', 'sentinel'];
                    entities.push({
                        type: types[Math.floor(Math.random()*3)],
                        x: x+w/2, y: y-30, w:30, h:30, vx:1, vy:0, hp:30
                    });
                }
            }
        }
    }

    function loop() {
        if(gameState==='DEAD') return;
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function update() {
        // Input Physics
        if(inputs.active) {
            player.vx += inputs.x * 0.8;
            if(Math.abs(inputs.x)>0.1) player.facing = Math.sign(inputs.x);
        }
        player.vx *= player.grounded ? 0.8 : 0.96;
        player.vy += 0.6; // Gravity

        player.x += player.vx;
        player.y += player.vy;

        // Walls
        const off = Math.sin(player.y*0.002) * (W*0.25);
        const wallL = (W/2 + off) - 200;
        const wallR = (W/2 + off) + 200;
        if(player.x < wallL) { player.x = wallL; player.vx = 0; }
        if(player.x+player.w > wallR) { player.x = wallR-player.w; player.vx = 0; }

        // Platforms
        let wasGrounded = player.grounded;
        player.grounded = false;
        if(player.vy > 0) {
            platforms.forEach(p => {
                if(player.x+player.w > p.x && player.x < p.x+p.w &&
                   player.y+player.h >= p.y && player.y+player.h <= p.y+p.h+player.vy+8) {
                    player.grounded = true;
                    player.y = p.y - player.h;
                    player.vy = 0;
                    if(p.type === 'slime') { player.vy = -18; SFX.jump(); }
                }
            });
        }
        if(!wasGrounded && player.grounded) SFX.land();

        // ORACLE LOGIC (Disappearing)
        if(oracle.active) {
            // If player falls below the first platform or moves far, fade oracle
            if(player.y > oracle.y + 100) {
                oracle.alpha -= 0.02;
                if(oracle.alpha <= 0) oracle.active = false;
            }
        }

        // Jump
        if(inputs.jump && player.grounded) {
            player.vy = -14;
            SFX.jump();
            player.grounded = false;
            spawnParticles(player.x, player.y+60, '#fff', 5);
        }

        // Combat
        if(inputs.atk && player.atkTimer <= 0) {
            player.atkTimer = 15;
            SFX.slash();
            // Hitbox
            const cx = player.x + player.w/2 + (player.facing*40);
            const cy = player.y + player.h/2;
            entities.forEach(e => {
                if(Math.hypot(e.x-cx, e.y-cy) < 50) {
                    e.hp -= 35;
                    e.vx = player.facing * 8;
                    SFX.hit();
                    shake = 8;
                    spawnParticles(e.x, e.y, '#f00', 8);
                    showToast("HIT!", "#fa0");
                }
            });
        }
        if(player.atkTimer > 0) player.atkTimer--;

        // World Managment
        const targetY = player.y - H*0.4;
        if(targetY > camY) camY = targetY;
        if(player.y > score) score = player.y;

        // Cleanup & Gen
        if(platforms[0].y < camY - 200) platforms.shift();
        if(platforms[platforms.length-1].y < camY + H + 500) genWorld(platforms[platforms.length-1].y, platforms[platforms.length-1].y+1000);

        // Entities AI
        entities = entities.filter(e => e.y > camY - 200 && e.hp > 0);
        entities.forEach(e => {
            e.x += e.vx; e.y += Math.sin(Date.now()/200);
            // Player Hit
            if(Math.abs(e.x - player.x) < 30 && Math.abs(e.y - player.y) < 40 && player.invincible <= 0) {
                player.hp -= 20;
                player.invincible = 60;
                player.vy = -8;
                SFX.hit();
                shake = 15;
                showToast("OUCH!", "#f00");
            }
        });
        if(player.invincible>0) player.invincible--;

        // Death
        if(player.hp <= 0) {
            gameState = 'DEAD';
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').innerText = "DEPTH: " + Math.floor(score/10) + " M";
        }

        // UI
        document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
        document.getElementById('score-disp').innerText = Math.floor(score/10) + ' M';
        if(shake > 0) shake *= 0.9;
    }

    // ==========================================
    // 4. RENDERING (High Quality)
    // ==========================================
    function draw() {
        // BACKGROUND
        const depth = Math.min(1, score / 6000);
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, `rgb(${30*(1-depth)}, ${20*(1-depth)}, ${40*(1-depth)})`);
        bg.addColorStop(1, '#050505');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake - camY);

        // Tunnel Walls (Parallax)
        for(let y = Math.floor(camY/100)*100; y < camY+H+100; y+= 50) {
            const off = Math.sin(y*0.002) * (W*0.25);
            const cx = W/2 + off;
            ctx.fillStyle = '#1b1b1b';
            ctx.fillRect(0, y, cx-200, 52); // Left Wall
            ctx.fillRect(cx+200, y, W, 52); // Right Wall
            // Wall Texture
            ctx.fillStyle = '#111';
            ctx.fillRect(cx-200, y, 10, 52);
            ctx.fillRect(cx+190, y, 10, 52);
        }

        // Platforms
        platforms.forEach(p => {
            if(p.type === 'stone') ctx.fillStyle = '#555';
            else if(p.type === 'ice') ctx.fillStyle = '#aef';
            else ctx.fillStyle = '#2d2';
            
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // 3D Side
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(p.x+5, p.y+p.h, p.w-5, 5);
        });

        // ORACLE (If Active)
        if(oracle.active) {
            ctx.save();
            ctx.globalAlpha = oracle.alpha;
            // Robe
            ctx.fillStyle = C.ORACLE_CLOAK;
            ctx.beginPath();
            ctx.moveTo(oracle.x, oracle.y);
            ctx.lineTo(oracle.x - 20, oracle.y + 60);
            ctx.lineTo(oracle.x + 20, oracle.y + 60);
            ctx.fill();
            // Hood
            ctx.fillStyle = '#240046';
            ctx.beginPath(); ctx.arc(oracle.x, oracle.y+10, 12, 0, Math.PI*2); ctx.fill();
            // Glowing Eyes
            ctx.fillStyle = '#c77dff';
            ctx.shadowColor = '#e0aaff'; ctx.shadowBlur = 10;
            ctx.fillRect(oracle.x-6, oracle.y+8, 4, 4);
            ctx.fillRect(oracle.x+2, oracle.y+8, 4, 4);
            ctx.shadowBlur = 0;
            
            // Text Bubble
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            const bx = oracle.x - 100, by = oracle.y - 60;
            ctx.fillRect(bx, by, 200, 40);
            ctx.strokeRect(bx, by, 200, 40);
            // Tail
            ctx.beginPath(); ctx.moveTo(oracle.x, oracle.y-20); ctx.lineTo(oracle.x-10, by+40); ctx.lineTo(oracle.x+10, by+40); ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("To save your brothers", oracle.x, by+15);
            ctx.fillText("descend to the underworld.", oracle.x, by+30);
            
            ctx.restore();
        }

        // Entities
        entities.forEach(e => {
            if(e.type === 'bat') {
                ctx.fillStyle = '#555';
                let w = Math.sin(Date.now()/50)*10;
                ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x-15,e.y-10+w); ctx.lineTo(e.x+15,e.y-10+w); ctx.fill();
                ctx.beginPath(); ctx.arc(e.x,e.y,8,0,Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = e.type==='slime'?'#0f0':'#f0f';
                ctx.fillRect(e.x-15, e.y-15, 30, 30);
                // Eyes
                ctx.fillStyle = '#fff'; ctx.fillRect(e.x-5, e.y-5, 4, 4); ctx.fillRect(e.x+5, e.y-5, 4, 4);
            }
        });

        // Player
        let state = !player.grounded ? 'jump' : (Math.abs(player.vx)>0.1?'run':'idle');
        if(player.atkTimer > 0) state = 'atk';
        warriorSprite.draw(ctx, player.x+player.w/2, player.y+player.h/2, player.facing, state, player.invincible);

        // Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life--;
            ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3);
            if(p.life<=0) particles.splice(i, 1);
        });

        // Dark Vignette
        const rad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
        rad.addColorStop(0, 'transparent'); rad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = rad;
        ctx.translate(0, camY); // Reset cam for static overlay
        ctx.fillRect(0, 0, W, H);
        
        ctx.restore();
    }

    function spawnParticles(x, y, c, n) {
        for(let i=0; i<n; i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,c});
    }

    function showToast(msg, c) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.color = c; t.style.opacity = 1;
        setTimeout(()=>t.style.opacity=0, 800);
    }

    // ==========================================
    // 5. INPUT HANDLING
    // ==========================================
    const inputs = { x:0, jump:false, atk:false, active:false };
    const stick = document.getElementById('stick-zone');
    const knob = document.getElementById('stick-knob');
    const base = document.getElementById('stick-base');
    let tId = null, sX, sY;

    stick.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.changedTouches[0]; tId = t.identifier;
        sX = t.clientX; sY = t.clientY;
        const rect = stick.getBoundingClientRect();
        base.style.display = 'block';
        base.style.left = (sX - rect.left - 50) + 'px';
        base.style.top = (sY - rect.top - 50) + 'px';
        inputs.active = true;
    }, {passive:false});

    stick.addEventListener('touchmove', e => {
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++) {
            if(e.changedTouches[i].identifier === tId) {
                let dx = e.changedTouches[i].clientX - sX;
                let dy = e.changedTouches[i].clientY - sY;
                let dist = Math.hypot(dx,dy);
                if(dist>40) { dx=(dx/dist)*40; dy=(dy/dist)*40; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                inputs.x = dx/40;
            }
        }
    }, {passive:false});

    const endStick = () => { tId=null; inputs.x=0; inputs.active=false; base.style.display='none'; knob.style.transform='none'; };
    stick.addEventListener('touchend', endStick); stick.addEventListener('touchcancel', endStick);

    const bind = (id, k) => {
        const b = document.getElementById(id);
        b.addEventListener('touchstart', e=>{e.preventDefault(); inputs[k]=true; b.style.transform='scale(0.9)';});
        b.addEventListener('touchend', e=>{e.preventDefault(); inputs[k]=false; b.style.transform='scale(1)';});
    };
    bind('btn-jump', 'jump'); bind('btn-atk', 'atk');

</script>
</body>
</html>
