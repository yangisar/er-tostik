<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: The Deepest Drop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* --- UI Overlay --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top HUD */
        .hud-top {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            height: 80px;
        }

        /* Health Bar Design */
        .bar-container {
            width: 150px;
            height: 20px;
            background: #222;
            border: 2px solid #555;
            transform: skewX(-20deg);
            position: relative;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #8a0e0e, #ff4444);
            transition: width 0.2s;
        }
        .hud-text {
            color: #d4af37;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #d4af37;
            margin-bottom: 5px;
        }

        /* Controls Container */
        .controls-area {
            height: 220px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto; 
            padding-bottom: 30px;
        }

        /* Button Styling */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.1s;
        }
        .btn:active {
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
            transform: scale(0.95);
            color: #fff;
        }

        /* Left Control Cluster (D-PAD) */
        .d-pad-grid {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            align-items: end;
        }
        /* Positioning inside Grid */
        #btn-jump { grid-column: 2; grid-row: 1; border-color: #00ffff; color: #00ffff; } /* Top Center */
        #btn-left { grid-column: 1; grid-row: 2; } /* Bottom Left */
        #btn-down { grid-column: 2; grid-row: 2; } /* Bottom Center */
        #btn-right { grid-column: 3; grid-row: 2; } /* Bottom Right */

        /* Right Control (Combat) */
        .combat-area {
            display: flex;
            align-items: flex-end;
            padding-right: 10px;
        }
        #btn-atk {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 3rem;
            border-color: #ff4444;
            color: #ff4444;
            background: rgba(50, 0, 0, 0.3);
        }
        #btn-atk:active {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 20px #ff0000;
        }

        /* Screens */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,10,0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 20;
            color: #d4af37;
            text-align: center;
        }
        .hidden { display: none !important; }
        .main-btn {
            margin-top: 20px;
            padding: 15px 50px;
            font-family: 'Cinzel';
            font-size: 1.5rem;
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div>
                <div class="hud-text">HP</div>
                <div class="bar-container"><div id="hp-bar" class="hp-fill"></div></div>
            </div>
            <div style="text-align: right;">
                <div class="hud-text" style="font-size: 0.8rem; color: #aaa;">DEPTH</div>
                <div id="score-disp" style="font-size: 2rem;">0m</div>
            </div>
        </div>

        <div class="controls-area">
            
            <div class="d-pad-grid">
                <div id="btn-jump" class="btn">▲</div>
                <div id="btn-left" class="btn">◄</div>
                <div id="btn-down" class="btn">▼</div>
                <div id="btn-right" class="btn">►</div>
            </div>

            <div class="combat-area">
                <div id="btn-atk" class="btn">⚔</div>
            </div>

        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 0; text-shadow: 0 0 20px cyan;">ER TOSTIK</h1>
        <h2 style="color: #aaa; margin-top: 0;">SHADOW DESCENT</h2>
        <p>LEFT CONTROLS: Move, Jump, Crawl</p>
        <p>RIGHT: Attack</p>
        <p style="color: cyan;">Hold ▼ + ▲ to drop through floors</p>
        <button class="main-btn" onclick="startGame()">BEGIN</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #ff4444;">FALLEN</h1>
        <p id="final-depth">0m</p>
        <button class="main-btn" onclick="startGame()">RISE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Config ---
        let W, H;
        const GRAVITY = 0.5;
        const FRICTION = 0.8;
        const WALL_THICKNESS = 30;
        
        // --- State ---
        let gameActive = false;
        let camY = 0;
        let maxDepth = 0;
        let inputs = { left: false, right: false, up: false, down: false, atk: false };
        
        // --- Assets (Procedural) ---
        let particles = [];
        let platforms = [];
        let enemies = [];
        
        let player = {
            x: 0, y: 0, w: 30, h: 50, // Bigger player
            vx: 0, vy: 0,
            hp: 100,
            facing: 1,
            state: 'idle', // idle, run, jump, crawl
            grounded: false,
            invincible: 0,
            atkTimer: 0,
            dropTimer: 0, // For dropping through platforms
            scarf: [] // Array of points for scarf physics
        };

        // --- Input System ---
        function bind(id, k) {
            const b = document.getElementById(id);
            const press = (e) => { e.preventDefault(); inputs[k] = true; };
            const release = (e) => { e.preventDefault(); inputs[k] = false; };
            b.addEventListener('mousedown', press); b.addEventListener('mouseup', release);
            b.addEventListener('touchstart', press); b.addEventListener('touchend', release);
            b.addEventListener('mouseleave', release);
        }
        bind('btn-left', 'left');
        bind('btn-right', 'right');
        bind('btn-jump', 'up');
        bind('btn-down', 'down');
        bind('btn-atk', 'atk');

        window.addEventListener('keydown', e => {
            if(e.key==='ArrowLeft') inputs.left=true;
            if(e.key==='ArrowRight') inputs.right=true;
            if(e.key==='ArrowUp') inputs.up=true;
            if(e.key==='ArrowDown') inputs.down=true;
            if(e.key==='z') inputs.atk=true;
        });
        window.addEventListener('keyup', e => {
            if(e.key==='ArrowLeft') inputs.left=false;
            if(e.key==='ArrowRight') inputs.right=false;
            if(e.key==='ArrowUp') inputs.up=false;
            if(e.key==='ArrowDown') inputs.down=false;
            if(e.key==='z') inputs.atk=false;
        });

        // --- Core ---
        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
        }
        window.addEventListener('resize', resize);
        resize();

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            
            player.x = W/2;
            player.y = 100;
            player.vx = 0; player.vy = 0;
            player.hp = 100;
            player.scarf = [];
            for(let i=0; i<5; i++) player.scarf.push({x:player.x, y:player.y});

            platforms = [];
            enemies = [];
            particles = [];
            camY = 0;
            maxDepth = 0;

            // Generate Walls
            // We simulate walls by just checking X bounds, but visual drawing will be handled in render

            // Start Platform
            platforms.push({x: W/2 - 100, y: 250, w: 200, type: 'stone'});
            genWorld(300, 1500);

            gameActive = true;
            loop();
        }

        function genWorld(sy, ey) {
            let y = sy;
            while(y < ey) {
                y += 80 + Math.random() * 100;
                let w = 80 + Math.random() * 150;
                let x = WALL_THICKNESS + Math.random() * (W - w - WALL_THICKNESS*2);
                
                platforms.push({x, y, w, type: 'stone'});

                // Enemy
                if (Math.random() < 0.4) {
                    enemies.push({
                        x: x + w/2, y: y-20, 
                        vx: 1, hp: 1, 
                        patrol: [x, x+w]
                    });
                }
            }
        }

        function update() {
            // -- Physics --
            if (inputs.left) { player.vx -= 0.8; player.facing = -1; }
            if (inputs.right) { player.vx += 0.8; player.facing = 1; }
            
            // Crawl Logic
            if (inputs.down && player.grounded) {
                player.state = 'crawl';
                player.vx *= 0.5; // Slow move when crawling
                player.h = 30; // Shrink
            } else {
                player.h = 50; // Normal height
                player.state = 'idle';
            }

            // Drop Through Platform
            if (inputs.down && inputs.up && player.grounded) {
                player.grounded = false;
                player.y += 5; // Nudge down through platform
                player.dropTimer = 10; // Disable collisions briefly
            } 
            // Jump
            else if (inputs.up && player.grounded && !inputs.down) {
                player.vy = -13;
                player.grounded = false;
                // Dust
                for(let i=0; i<5; i++) spawnPart(player.x, player.y+25, '#888', 2);
            }

            // Attack
            if (inputs.atk && player.atkTimer <= 0) {
                player.atkTimer = 15;
                // Spawn Slash
                let hitX = player.x + (player.facing * 40);
                spawnPart(hitX, player.y, '#0ff', 10);
                
                // Hit Check
                enemies.forEach(e => {
                    if (Math.hypot(e.x - player.x, e.y - player.y) < 60) {
                        e.hp = 0;
                        spawnPart(e.x, e.y, '#f00', 5);
                    }
                });
            }
            if (player.atkTimer > 0) player.atkTimer--;
            if (player.dropTimer > 0) player.dropTimer--;

            // Apply Physics
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // -- Walls (Borders) --
            if (player.x < WALL_THICKNESS + 10) { player.x = WALL_THICKNESS + 10; player.vx = 0; }
            if (player.x > W - WALL_THICKNESS - 10) { player.x = W - WALL_THICKNESS - 10; player.vx = 0; }

            // -- Platform Collisions --
            player.grounded = false;
            if (player.dropTimer === 0 && player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x > p.x - 10 && player.x < p.x + p.w + 10 &&
                        player.y + player.h/2 >= p.y - 10 && 
                        player.y + player.h/2 <= p.y + 10) {
                        
                        player.grounded = true;
                        player.vy = 0;
                        player.y = p.y - player.h/2;
                    }
                });
            }

            // -- Scarf Physics --
            let headX = player.x - (player.facing * 5);
            let headY = player.y - 15;
            player.scarf[0] = {x: headX, y: headY};
            for(let i=1; i<player.scarf.length; i++) {
                let prev = player.scarf[i-1];
                let curr = player.scarf[i];
                curr.x += (prev.x - curr.x) * 0.3 + (player.vx * -0.1);
                curr.y += (prev.y - curr.y) * 0.3 + (player.vy * -0.1) + 1; // Gravity on scarf
            }

            // -- Enemies --
            enemies.forEach((e, i) => {
                if(e.hp <= 0) { enemies.splice(i,1); return; }
                
                // Patrol
                e.x += e.vx;
                if(e.x < e.patrol[0] || e.x > e.patrol[1]) e.vx *= -1;

                // Hit Player
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < 30 && player.invincible <= 0) {
                    player.hp -= 20;
                    player.invincible = 60;
                    player.vy = -5;
                    player.vx = -player.facing * 10;
                    spawnPart(player.x, player.y, '#f00', 5);
                }
            });
            if(player.invincible > 0) player.invincible--;
            if(player.hp <= 0) gameOver();

            // -- Camera --
            let targetY = player.y - H * 0.4;
            if (targetY > camY) camY = targetY;
            
            // World Gen
            if (player.y > maxDepth) maxDepth = player.y;
            if (platforms[platforms.length-1].y < camY + H*1.5) genWorld(platforms[platforms.length-1].y, platforms[platforms.length-1].y + 1000);

            // Cleanup
            if(platforms[0].y < camY - 100) platforms.shift();

            // UI
            document.getElementById('hp-bar').style.width = player.hp + "%";
            document.getElementById('score-disp').innerText = Math.floor(maxDepth/10) + "m";
        }

        function spawnPart(x, y, c, s) {
            particles.push({x, y, c, vx: (Math.random()-0.5)*s, vy: (Math.random()-0.5)*s, l: 1});
        }

        function draw() {
            // 1. Background (Dark Void)
            ctx.fillStyle = "#050508";
            ctx.fillRect(0,0,W,H);

            // Parallax Stars
            ctx.fillStyle = "#333";
            for(let i=0; i<50; i++) {
                let sy = ((i * 137) + camY * 0.5) % H;
                let sx = (i * 93) % W;
                ctx.fillRect(sx, sy, 2, 2);
            }

            ctx.save();
            ctx.translate(0, -camY);

            // 2. Walls (Textured)
            ctx.fillStyle = "#111"; // Dark Rock
            ctx.fillRect(0, camY, WALL_THICKNESS, H);
            ctx.fillRect(W - WALL_THICKNESS, camY, WALL_THICKNESS, H);
            
            // Wall Texture (Stripes)
            ctx.strokeStyle = "#222";
            ctx.beginPath();
            for(let y=Math.floor(camY/50)*50; y<camY+H; y+=50) {
                ctx.moveTo(0, y); ctx.lineTo(WALL_THICKNESS, y+20);
                ctx.moveTo(W, y); ctx.lineTo(W-WALL_THICKNESS, y+20);
            }
            ctx.stroke();

            // 3. Platforms
            platforms.forEach(p => {
                // Glow
                ctx.shadowBlur = 10; ctx.shadowColor = "#2a2a40";
                ctx.fillStyle = "#1a1a2e";
                ctx.fillRect(p.x, p.y, p.w, 10);
                ctx.shadowBlur = 0;
                
                // Detail
                ctx.fillStyle = "#4a4a6e";
                ctx.fillRect(p.x, p.y, p.w, 2);
            });

            // 4. Enemies
            enemies.forEach(e => {
                ctx.fillStyle = "#000";
                ctx.beginPath(); ctx.arc(e.x, e.y, 15, 0, Math.PI*2); ctx.fill();
                // Eyes
                ctx.fillStyle = "#ff0044";
                ctx.shadowBlur = 5; ctx.shadowColor = "red";
                ctx.fillRect(e.x + (Math.sign(e.vx)*6), e.y-5, 4, 3);
                ctx.shadowBlur = 0;
            });

            // 5. Player (Maximized Visuals)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(player.facing, 1); // Flip all drawing
            
            if (player.invincible > 0 && Math.floor(Date.now()/50)%2==0) ctx.globalAlpha = 0.3;

            // Scarf (Draw relative to player 0,0)
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = "cyan";
            ctx.beginPath();
            player.scarf.forEach((p, i) => {
                // Transform global scarf points to local space for flipping
                let lx = (p.x - player.x) * player.facing; 
                let ly = p.y - player.y;
                if(i===0) ctx.moveTo(lx, ly);
                else ctx.lineTo(lx, ly);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Body
            ctx.fillStyle = "#e0f7fa";
            if (player.state === 'crawl') {
                ctx.fillRect(-10, 10, 20, 15); // Crawling shape
            } else {
                ctx.fillRect(-8, -10, 16, 35); // Standing
            }
            
            // Head
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(0, -15, 10, 0, Math.PI*2); ctx.fill();

            // Sword
            if (player.atkTimer > 0) {
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 4;
                ctx.shadowBlur = 20; ctx.shadowColor = "#fff";
                ctx.beginPath();
                ctx.moveTo(10, 0); ctx.lineTo(60, 0); // Big swing
                ctx.stroke();
                ctx.shadowBlur = 0;
            } else {
                // Sheathed/Idle Sword
                ctx.fillStyle = "#aaa";
                ctx.fillRect(-5, 5, 20, 4);
            }

            ctx.restore();

            // 6. Particles
            particles.forEach((p,i) => {
                p.x += p.vx; p.y += p.vy; p.l -= 0.1;
                ctx.fillStyle = p.c; ctx.globalAlpha = p.l;
                ctx.fillRect(p.x, p.y, 4, 4);
                if(p.l<=0) particles.splice(i,1);
            });
            ctx.globalAlpha = 1;

            ctx.restore();

            // 7. Lighting Overlay (Vignette)
            // Create a gradient relative to screen center (simulates player light)
            let lightX = W/2; 
            let lightY = (player.y - camY); 

            let grad = ctx.createRadialGradient(lightX, lightY, 50, lightX, lightY, 600);
            grad.addColorStop(0, "rgba(0,0,0,0)"); // Transparent center
            grad.addColorStop(0.3, "rgba(5,5,15,0.3)");
            grad.addColorStop(1, "rgba(0,0,0,0.95)"); // Pitch black edges

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-depth').innerText = Math.floor(maxDepth/10) + "m";
        }

        function loop() {
            if(gameActive) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }

    </script>
</body>
</html>
