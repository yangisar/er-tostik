<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Er Tostik: Deep Descent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Cinzel', serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top HUD */
        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            color: #d4af37;
            font-size: 1rem;
            text-shadow: 0 0 5px #000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Controls */
        .controls-area {
            height: 180px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
            padding-bottom: 40px;
        }

        .btn-circle {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-circle:active {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(0.95);
        }

        .d-pad { display: flex; gap: 15px; align-items: flex-end; }
        .btn-move { width: 70px; height: 70px; font-size: 2rem; }

        .action-pad { display: flex; gap: 15px; align-items: flex-end; }
        .btn-atk { width: 90px; height: 90px; font-size: 2.5rem; border-color: #ff4444; color: #ff4444; }
        .btn-jump { width: 60px; height: 60px; margin-bottom: 10px; }

        /* Screens */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #d4af37;
            pointer-events: auto;
            z-index: 10;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        h1 { margin: 0 0 10px 0; font-size: 2rem; color: #fff; text-shadow: 0 0 10px #00ffff; }
        p { color: #aaa; max-width: 80%; margin-bottom: 30px; line-height: 1.4; }
        
        .main-btn {
            padding: 15px 40px;
            border: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
        }
        .toast {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box">
                <div id="score">Depth: 0m</div>
                <div id="armor-display" style="color: #aaa; font-size: 0.8rem;">Armor: 0</div>
            </div>
            <div class="stat-box" style="align-items: flex-end;">
                <div id="health">HP: 100</div>
                <div id="weapon-display" style="color: #00ffff; font-size: 0.8rem;">Blade: Normal</div>
            </div>
        </div>

        <div id="msg-toast" class="toast">ITEM ACQUIRED</div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn-circle btn-move" id="btn-left">◄</div>
                <div class="btn-circle btn-move" id="btn-right">►</div>
            </div>
            <div class="action-pad">
                <div class="btn-circle btn-jump" id="btn-jump">⭱</div>
                <div class="btn-circle btn-atk" id="btn-atk">⚔</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen-overlay">
        <h1>ER TOSTIK</h1>
        <p>The Spirits guide you.</p>
        <p>Sides are blocked.<br>Fall on enemies to crush them.<br>Find flasks and ancient steel.</p>
        <button class="main-btn" onclick="initGame()">Descend</button>
    </div>

    <div id="game-over-screen" class="screen-overlay hidden">
        <h1 style="color:#ff4444">SPIRIT BROKEN</h1>
        <p id="final-score">Depth: 0m</p>
        <button class="main-btn" onclick="initGame()">Rise Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Game Config ---
        let width, height;
        const GRAVITY = 0.6;
        const FRICTION = 0.8;
        const MOVE_SPEED = 6;
        const JUMP_FORCE = -14;
        
        // --- State ---
        let gameRunning = false;
        let cameraY = 0;
        let maxDepth = 0;
        let inputs = { left: false, right: false, jump: false, attack: false };
        let particles = [];
        
        // --- Entities ---
        let player = {
            x: 0, y: 0, w: 20, h: 40,
            vx: 0, vy: 0,
            hp: 100,
            maxHp: 100,
            armor: 0,
            attackRange: 40,
            attackLevel: 1,
            facing: 1, 
            attackCooldown: 0,
            isAttacking: false,
            grounded: false,
            invincible: 0
        };

        let platforms = [];
        let enemies = [];
        let items = [];

        // --- Input Handling ---
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); inputs[key] = true; };
            const end = (e) => { e.preventDefault(); inputs[key] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        };

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        
        const jumpBtn = document.getElementById('btn-jump');
        const doJump = (e) => { e.preventDefault(); if(player.grounded) player.vy = JUMP_FORCE; };
        jumpBtn.addEventListener('touchstart', doJump);
        jumpBtn.addEventListener('mousedown', doJump);

        const atkBtn = document.getElementById('btn-atk');
        const doAttack = (e) => {
            e.preventDefault();
            if(player.attackCooldown <= 0) {
                player.isAttacking = true;
                player.attackCooldown = 20;
                checkCombat();
            }
        };
        atkBtn.addEventListener('touchstart', doAttack);
        atkBtn.addEventListener('mousedown', doAttack);

        // Keyboard
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') inputs.left = true;
            if(e.key === 'ArrowRight') inputs.right = true;
            if(e.key === ' ' && player.grounded) player.vy = JUMP_FORCE;
            if(e.key === 'z') doAttack(e);
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') inputs.left = false;
            if(e.key === 'ArrowRight') inputs.right = false;
        });

        // --- Core Functions ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function showToast(msg, color) {
            const t = document.getElementById('msg-toast');
            t.innerText = msg;
            t.style.color = color;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 1500);
        }

        function initGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            player.x = width / 2;
            player.y = 100;
            player.vx = 0; 
            player.vy = 0;
            player.hp = 100;
            player.armor = 0;
            player.attackLevel = 1;
            player.attackRange = 40;
            cameraY = 0;
            maxDepth = 0;
            
            platforms = [];
            enemies = [];
            items = [];
            particles = [];
            
            // Start Platform
            createPlatform(width/2 - 100, 200, 200);
            
            // Generate world ahead
            generateWorld(200, 2000);
            
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function createPlatform(x, y, w) {
            // Generate jagged edges for natural look
            let points = [];
            let segments = 10;
            let segmentWidth = w / segments;
            for(let i=0; i<=segments; i++) {
                points.push({
                    x: x + (i * segmentWidth),
                    y: y + (Math.random() * 10 - 5) // Roughness
                });
            }
            platforms.push({x, y, w, h: 30, points: points});
        }

        function generateWorld(startY, endY) {
            let y = startY;
            while(y < endY) {
                y += 80 + Math.random() * 120; // Vertical Gap
                let w = 100 + Math.random() * 150;
                let x = Math.random() * (width - w);
                
                createPlatform(x, y, w);

                // Add Enemy (Increasing chance with depth)
                if (Math.random() < 0.4) {
                    enemies.push({
                        x: x + w/2,
                        y: y - 40,
                        w: 30, h: 30,
                        patrolStart: x,
                        patrolEnd: x + w,
                        vx: 1 + Math.random(),
                        hp: 1,
                        type: 'shadow'
                    });
                }

                // Add Item (10% chance)
                if (Math.random() < 0.15) {
                    let type = Math.random();
                    let itemType = 'health';
                    if (type > 0.6) itemType = 'armor';
                    if (type > 0.9) itemType = 'weapon';
                    
                    items.push({
                        x: x + w/2,
                        y: y - 30,
                        type: itemType,
                        bobOffset: Math.random() * 10
                    });
                }
            }
        }

        function checkCombat() {
            let hitX = player.x + (player.facing * (20 + player.attackRange/2));
            let hitY = player.y;
            
            // Visual Slash
            for(let i=0; i<8; i++) createParticle(hitX, hitY, '#00ffff', 6);

            enemies.forEach((en, i) => {
                let dx = en.x - player.x;
                let dy = en.y - en.y; // Height diff negligible for simple hitbox
                let dist = Math.sqrt(Math.pow(en.x - player.x, 2) + Math.pow(en.y - player.y, 2));
                
                // Attack Hit Logic
                if (dist < player.attackRange + 20 && Math.sign(dx) === player.facing) {
                    en.hp--;
                    // Blood effect
                    for(let k=0; k<10; k++) createParticle(en.x, en.y, '#ff0000', 4);
                }
            });
        }

        function createParticle(x, y, col, speed) {
            particles.push({
                x, y, col,
                vx: (Math.random() - 0.5) * speed,
                vy: (Math.random() - 0.5) * speed,
                life: 1.0
            });
        }

        function update() {
            if (!gameRunning) return;

            // --- Player Physics ---
            if (inputs.left) { player.vx -= 0.8; player.facing = -1; }
            if (inputs.right) { player.vx += 0.8; player.facing = 1; }
            
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            
            // Limit horizontal speed
            if(player.vx > MOVE_SPEED) player.vx = MOVE_SPEED;
            if(player.vx < -MOVE_SPEED) player.vx = -MOVE_SPEED;

            player.x += player.vx;
            player.y += player.vy;

            // ** BOUNDARIES ** if (player.x < 0) { player.x = 0; player.vx = 0; }
            if (player.x > width) { player.x = width; player.vx = 0; }

            // Cooldowns
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.isAttacking && player.attackCooldown < 15) player.isAttacking = false;
            if (player.invincible > 0) player.invincible--;

            // --- Collisions ---
            player.grounded = false;
            
            // Platform Collision
            platforms.forEach(p => {
                // Check if feet interact with platform top
                if (player.vy > 0 && 
                    player.y + 20 >= p.y - 10 && 
                    player.y + 20 <= p.y + 20 && 
                    player.x >= p.x && 
                    player.x <= p.x + p.w) {
                        
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - 20; // Place on top
                }
            });

            // Enemy Logic
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                
                if (en.hp <= 0) {
                    // Loot drop chance on kill (30%)
                    if(Math.random() < 0.3) items.push({x: en.x, y: en.y, type: 'health', bobOffset:0});
                    enemies.splice(i, 1);
                    continue;
                }

                // Patrol
                en.x += en.vx;
                if (en.x > en.patrolEnd || en.x < en.patrolStart) en.vx *= -1;

                // Collision with Player
                let dx = player.x - en.x;
                let dy = player.y - en.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 35) {
                    // ** STOMP MECHANIC **
                    // If player is falling and is above enemy
                    if (player.vy > 2 && player.y < en.y - 10) {
                        en.hp = 0;
                        player.vy = -8; // Bounce up
                        createParticle(en.x, en.y, '#fff', 8); // Smash effect
                        showToast("CRUSHED!", "#fff");
                    } 
                    // Getting Hurt
                    else if (player.invincible <= 0) {
                        let dmg = 20 - player.armor;
                        if (dmg < 5) dmg = 5;
                        player.hp -= dmg;
                        player.invincible = 60;
                        player.vy = -5;
                        player.vx = -Math.sign(dx) * 8;
                        createParticle(player.x, player.y, '#ff0000', 5);
                    }
                }
            }

            // Item Logic
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                let dist = Math.hypot(player.x - it.x, player.y - it.y);
                
                if (dist < 30) {
                    // Pickup
                    if (it.type === 'health') {
                        player.hp = Math.min(100, player.hp + 30);
                        showToast("HEALTH +30", "#ff4444");
                    } else if (it.type === 'armor') {
                        player.armor = Math.min(15, player.armor + 5);
                        showToast("ARMOR UP", "#ffd700");
                    } else if (it.type === 'weapon') {
                        player.attackLevel++;
                        player.attackRange += 10;
                        showToast("BLADE SHARPENED", "#00ffff");
                    }
                    items.splice(i, 1);
                }
            }

            // Death Check
            if (player.hp <= 0) {
                gameRunning = false;
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `Depth: ${Math.floor(maxDepth)}m`;
            }

            // --- Camera & Gen ---
            let targetCamY = player.y - height * 0.4;
            if (targetCamY > cameraY) cameraY = targetCamY;
            if (player.y > maxDepth) maxDepth = player.y;

            let deepestPlatform = platforms[platforms.length-1].y;
            if (deepestPlatform < cameraY + height * 2) {
                generateWorld(deepestPlatform, deepestPlatform + 1000);
            }

            // Cleanup
            if (platforms[0].y < cameraY - 100) platforms.shift();
            enemies = enemies.filter(e => e.y > cameraY - 100);
            items = items.filter(i => i.y > cameraY - 100);

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            });

            // UI
            document.getElementById('score').innerText = `Depth: ${Math.floor(maxDepth/10)}m`;
            document.getElementById('health').innerText = `HP: ${player.hp}`;
            document.getElementById('armor-display').innerText = `Armor: ${player.armor}`;
            let wpnTxt = player.attackLevel === 1 ? "Rusty" : (player.attackLevel === 2 ? "Forged" : "Spirit");
            document.getElementById('weapon-display').innerText = `Blade: ${wpnTxt}`;
        }

        // --- Drawing ---

        function drawEnvironment() {
            // Background Gradient based on depth
            let depthFactor = Math.min(1, maxDepth / 10000);
            let r = 5 + (depthFactor * 40); // Becomes slightly redder
            let b = 16 - (depthFactor * 10); // Loses blue
            
            let bg = ctx.createLinearGradient(0, 0, 0, height);
            bg.addColorStop(0, `rgb(${r}, 5, ${b})`);
            bg.addColorStop(1, `rgb(${r*2}, 10, ${b*2})`);
            
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);
        }

        function drawPlatforms() {
            ctx.fillStyle = "#1a1a2e";
            ctx.strokeStyle = "#3e3e5e";
            ctx.lineWidth = 2;

            platforms.forEach(p => {
                ctx.beginPath();
                let pts = p.points;
                ctx.moveTo(pts[0].x, pts[0].y);
                for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                
                ctx.lineTo(p.x + p.w, p.y + p.h);
                ctx.lineTo(p.x, p.y + p.h);
                ctx.closePath();
                ctx.fill();
                
                // Draw just top jagged line highlight
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();
            });
        }

        function drawItems() {
            items.forEach(it => {
                let y = it.y + Math.sin((Date.now() / 200) + it.bobOffset) * 5;
                
                if (it.type === 'health') {
                    ctx.fillStyle = "#ff0000";
                    ctx.beginPath(); ctx.arc(it.x, y, 6, 0, Math.PI*2); ctx.fill();
                    // Cross
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(it.x-2, y-6, 4, 12); ctx.fillRect(it.x-6, y-2, 12, 4);
                } else if (it.type === 'armor') {
                    ctx.fillStyle = "#ffd700";
                    ctx.beginPath(); ctx.moveTo(it.x, y+8); ctx.lineTo(it.x+7, y-5); ctx.lineTo(it.x-7, y-5); ctx.fill();
                } else {
                    ctx.fillStyle = "#00ffff";
                    ctx.fillRect(it.x-2, y-10, 4, 20);
                }
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // ** VISUAL CONTRAST **
            // Glow behind player
            ctx.shadowBlur = 20;
            ctx.shadowColor = "cyan";
            
            // I-Frame blink
            if (player.invincible > 0 && Math.floor(Date.now()/50)%2==0) ctx.globalAlpha = 0.5;

            // Body (White/Cyan Spirit Form)
            ctx.fillStyle = "#e0ffff";
            ctx.beginPath(); ctx.arc(0, -15, 8, 0, Math.PI*2); ctx.fill(); // Head
            ctx.fillRect(-5, -8, 10, 24); // Torso

            // Animated Legs
            if (!player.grounded) {
                // Falling pose
                ctx.fillRect(-6, 12, 4, 10); ctx.fillRect(2, 8, 4, 8);
            } else if (Math.abs(player.vx) > 0.5) {
                // Running
                let leg = Math.sin(Date.now() / 60) * 8;
                ctx.fillRect(-6 + leg, 12, 4, 12);
                ctx.fillRect(2 - leg, 12, 4, 12);
            } else {
                // Idle
                ctx.fillRect(-6, 12, 4, 12); ctx.fillRect(2, 12, 4, 12);
            }

            // Weapon
            ctx.save();
            ctx.translate(0, -5);
            let angle = player.isAttacking ? (player.facing * Math.PI/2) : (player.facing * -0.2);
            ctx.rotate(angle);
            
            // Sword Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.attackLevel > 1 ? "#00ffff" : "#fff";
            ctx.fillStyle = player.attackLevel > 1 ? "#00ffff" : "#aaa";
            
            ctx.fillRect(0, -2, player.attackRange, 4); // Blade
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(0, -4, 4, 8); // Hilt
            ctx.restore();

            ctx.restore();
        }

        function draw() {
            drawEnvironment();
            
            ctx.save();
            ctx.translate(0, -cameraY);

            drawPlatforms();
            drawItems();

            enemies.forEach(e => {
                ctx.fillStyle = "#000"; // Silhouette
                ctx.shadowBlur = 5; ctx.shadowColor = "#f0f";
                ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, Math.PI*2); ctx.fill();
                // Red Eyes
                ctx.fillStyle = "red"; ctx.shadowBlur = 0;
                ctx.fillRect(e.x + (Math.sign(e.vx)*4), e.y - 4, 4, 2);
            });

            drawPlayer();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.col;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function gameLoop() {
            if(!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
